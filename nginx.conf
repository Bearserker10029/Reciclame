events {}

http {
    # Permitir uploads hasta 55MB (igual que Spring Boot multipart limit)
    client_max_body_size 55M;

    upstream spring_backend {
        server reciclame-app1:8080;
        server reciclame-app2:8080;
        server reciclame-app3:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://spring_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /actuator/health/liveness {
            proxy_pass http://spring_backend/actuator/health/liveness;
            proxy_set_header Host $host;
        }

        location /actuator/health/readiness {
            proxy_pass http://spring_backend/actuator/health/readiness;
            proxy_set_header Host $host;
        }
    }
}