events {}

http {
    # 210 MB para alinear con Spring Boot multipart max-request-size.
    # El límite duro del front lo pone nginx-proxy-manager (ver UI de NPM).
    client_max_body_size 210M;
    # Buffers grandes para que nginx pueda recibir archivos pesados sin truncar headers.
    client_body_buffer_size 128k;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 16k;
    # Timeouts extendidos para uploads grandes y procesamiento (default 60s se queda corto).
    # Subido a 300s para tolerar PUTs con subida a MinIO + preview de imagen + GC pause.
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
    # Reintentar con otro app si uno falla (si app1 está muerto, intenta app2/app3).
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 30s;

    # Upstream con resolución DNS dinámica.
    # Usamos `set $backend` con variable para forzar a nginx a re-resolver
    # el nombre del servicio en cada conexión, no al arranque. Sin esto,
    # si un contenedor se reasigna a otra IP (ej. al eliminar reciclame-app3),
    # nginx sigue mandando tráfico a la IP vieja cacheada → connection refused.
    upstream spring_backend {
        server reciclame-app1:8080 max_fails=3 fail_timeout=30s;
        server reciclame-app2:8080 max_fails=3 fail_timeout=30s;
    }

    # Resolver interno de Docker (127.0.0.11). `valid=10s` re-resuelve cada 10s.
    # Necesario cuando se usa variable en proxy_pass para forzar DNS dinámico.
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 80;

        # Streaming del body: nginx no bufferea el archivo entero en disco antes de
        # pasarlo a Spring. Crítico para uploads grandes — evita 502 cuando el
        # archivo completo no entra en los buffers de nginx.
        client_body_in_file_only off;
        client_body_in_single_buffer on;
        proxy_request_buffering off;
        proxy_buffering off;

        location / {
            # Variable para forzar resolución DNS en cada request.
            # Sin resolver + variable, nginx cachea la IP al arranque y se rompe
            # cuando los contenedores se reasignan (ej. al hacer deploy o eliminar app3).
            set $backend_upstream http://spring_backend;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            set $backend_upstream http://spring_backend;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /actuator/health/liveness {
            set $backend_upstream http://spring_backend;
            proxy_pass $backend_upstream/actuator/health/liveness;
            proxy_set_header Host $host;
        }

        location /actuator/health/readiness {
            set $backend_upstream http://spring_backend;
            proxy_pass $backend_upstream/actuator/health/readiness;
            proxy_set_header Host $host;
        }
    }
}