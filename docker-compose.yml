services:
  reciclame-app:
    image: kent10029/reciclame:latest
    platform: linux/amd64
    container_name: reciclame-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3306/reciclame_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - MINIO_URL=http://host.docker.internal:9000
      - MINIO_INTERNAL_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=reciclame-docs
      - KKFILEVIEW_URL=http://host.docker.internal:8012
      - N8N_WEBHOOK_URL=http://host.docker.internal:5678/webhook/send-email
      - APP_BASE_URL=http://localhost:8080
      - APP_KK_ACCESSIBLE_URL=http://reciclame-app:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - reciclame-net

  n8n:
    image: n8nio/n8n:latest
    container_name: reciclame-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=true
      - GENERIC_TIMEZONE=America/Lima
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - reciclame-net

  minio:
    image: minio/minio:latest
    container_name: reciclame-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - reciclame-net

  minio-init:
    image: minio/mc:latest
    container_name: reciclame-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - reciclame-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/reciclame-docs &&
      mc anonymous set none local/reciclame-docs &&
      echo 'Bucket reciclame-docs listo (acceso privado, URLs firmadas via Spring).' &&
      exit 0
      "

  kkfileview:
    image: keking/kkfileview:latest
    container_name: reciclame-kkfileview
    ports:
      - "8012:8012"
    depends_on:
      - minio-init
    environment:
      - KK_HTTP_PREVIEW=true
      - SPRING_FREEMARKER_TEMPLATE_LOADER_PATH=file:/opt/kkFileView/templates/web/,classpath:/web/
    volumes:
      - ./kkfileview-templates/web:/opt/kkFileView/templates/web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - reciclame-net

networks:
  reciclame-net:
    driver: bridge

volumes:
  minio_data:
  n8n_data: