services:
  reciclame-app1:
    image: kent10029/reciclame:latest
    container_name: reciclame-app1
    platform: linux/amd64
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SPRING_PROFILES_ACTIVE=aws
      - SPRING_DATASOURCE_URL=jdbc:mysql://reciclame-db.cfowgekco09o.us-east-1.rds.amazonaws.com:3306/reciclame_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=Reciclame123
      - MINIO_URL=http://minio:9000
      - MINIO_INTERNAL_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=reciclame-docs
      - KKFILEVIEW_URL=http://kkfileview:8012
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/send-email
      - N8N_CHATBOT_WEBHOOK_URL=/webhook/chatbot-reciclame
      - APP_BASE_URL=https://reciclame.duckdns.org
      - APP_KK_ACCESSIBLE_URL=http://reciclame-app1:8080
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - APP_BACKUP_PATH=/backups
    volumes:
      - backup_data:/backups
    networks:
      - reciclame-net

  reciclame-app2:
    image: kent10029/reciclame:latest
    container_name: reciclame-app2
    platform: linux/amd64
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SPRING_PROFILES_ACTIVE=aws
      - SPRING_DATASOURCE_URL=jdbc:mysql://reciclame-db.cfowgekco09o.us-east-1.rds.amazonaws.com:3306/reciclame_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=Reciclame123
      - MINIO_URL=http://minio:9000
      - MINIO_INTERNAL_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=reciclame-docs
      - KKFILEVIEW_URL=http://kkfileview:8012
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/send-email
      - N8N_CHATBOT_WEBHOOK_URL=/webhook/chatbot-reciclame
      - APP_BASE_URL=https://reciclame.duckdns.org
      - APP_KK_ACCESSIBLE_URL=http://reciclame-app1:8080
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - APP_BACKUP_PATH=/backups
    volumes:
      - backup_data:/backups
    networks:
      - reciclame-net

  reciclame-app3:
    image: kent10029/reciclame:latest
    container_name: reciclame-app3
    platform: linux/amd64
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SPRING_PROFILES_ACTIVE=aws
      - SPRING_DATASOURCE_URL=jdbc:mysql://reciclame-db.cfowgekco09o.us-east-1.rds.amazonaws.com:3306/reciclame_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=Reciclame123
      - MINIO_URL=http://minio:9000
      - MINIO_INTERNAL_URL=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=reciclame-docs
      - KKFILEVIEW_URL=http://kkfileview:8012
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/send-email
      - N8N_CHATBOT_WEBHOOK_URL=/webhook/chatbot-reciclame
      - APP_BASE_URL=https://reciclame.duckdns.org
      - APP_KK_ACCESSIBLE_URL=http://reciclame-app1:8080
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - APP_BACKUP_PATH=/backups
    volumes:
      - backup_data:/backups
    networks:
      - reciclame-net

  redis:
    image: redis:7.4-alpine
    container_name: reciclame-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - reciclame-net

  nginx:
    image: nginx:1.25.4-alpine
    container_name: nginx_lb
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./favicon.ico:/usr/share/nginx/html/favicon.ico:ro
    depends_on:
      - reciclame-app1
      - reciclame-app2
      - reciclame-app3
    networks:
      - reciclame-net

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      DB_SQLITE_FILE: /data/database.sqlite
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - reciclame-net

  n8n:
    image: n8nio/n8n:latest
    container_name: reciclame-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/Lima
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - reciclame-net

  minio:
    image: minio/minio:latest
    container_name: reciclame-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - reciclame-net

  minio-init:
    image: minio/mc:latest
    container_name: reciclame-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - reciclame-net
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/reciclame-docs && mc anonymous set none local/reciclame-docs && echo 'Bucket reciclame-docs listo (acceso privado, URLs firmadas via Spring).' && exit 0 "

  kkfileview:
    image: keking/kkfileview:latest
    container_name: reciclame-kkfileview
    ports:
      - "8012:8012"
    depends_on:
      - minio-init
    environment:
      - KK_HTTP_PREVIEW=true
      - SPRING_FREEMARKER_TEMPLATE_LOADER_PATH=file:/opt/kkFileView/templates/web/,classpath:/web/
    volumes:
      - ./kkfileview-templates/web:/opt/kkFileView/templates/web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - reciclame-net

networks:
  reciclame-net:
    driver: bridge

volumes:
  minio_data:
  n8n_data:
  npm_data:
  npm_letsencrypt:
  redis_data:
  backup_data:
