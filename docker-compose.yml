services:
  reciclame-app1:
    image: kent10029/reciclame:latest
    container_name: reciclame-app1
    platform: linux/amd64
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - MINIO_URL=${MINIO_URL}
      - MINIO_INTERNAL_URL=${MINIO_INTERNAL_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - KKFILEVIEW_URL=${KKFILEVIEW_URL}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_CHATBOT_WEBHOOK_URL=${N8N_CHATBOT_WEBHOOK_URL}
      - APP_BASE_URL=${APP_BASE_URL}
      - APP_KK_ACCESSIBLE_URL=${APP_KK_ACCESSIBLE_URL}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
      - APP_BACKUP_PATH=${APP_BACKUP_PATH}
      - VERIFICA_API_KEY=${VERIFICA_API_KEY}
      - ATENEA_API_KEY=${ATENEA_API_KEY}
      - CENTRIFUGO_API_URL=${CENTRIFUGO_API_URL}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY}
      - CENTRIFUGO_SECRET=${CENTRIFUGO_SECRET}
      - CENTRIFUGO_WS_URL=${CENTRIFUGO_WS_URL}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - JAVA_OPTS=-Xms512m -Xmx1536m -XX:+UseG1GC -XX:MaxGCPauseMillis=150 -XX:+UseStringDeduplication -Djava.awt.headless=true -Duser.timezone=America/Lima -Dfile.encoding=UTF-8
    volumes:
      - backup_data:/backups
    networks:
      - reciclame-net

  reciclame-app2:
    image: kent10029/reciclame:latest
    container_name: reciclame-app2
    platform: linux/amd64
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - MINIO_URL=${MINIO_URL}
      - MINIO_INTERNAL_URL=${MINIO_INTERNAL_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - KKFILEVIEW_URL=${KKFILEVIEW_URL}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_CHATBOT_WEBHOOK_URL=${N8N_CHATBOT_WEBHOOK_URL}
      - APP_BASE_URL=${APP_BASE_URL}
      - APP_KK_ACCESSIBLE_URL=${APP_KK_ACCESSIBLE_URL}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
      - APP_BACKUP_PATH=${APP_BACKUP_PATH}
      - VERIFICA_API_KEY=${VERIFICA_API_KEY}
      - ATENEA_API_KEY=${ATENEA_API_KEY}
      - CENTRIFUGO_API_URL=${CENTRIFUGO_API_URL}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY}
      - CENTRIFUGO_SECRET=${CENTRIFUGO_SECRET}
      - CENTRIFUGO_WS_URL=${CENTRIFUGO_WS_URL}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - JAVA_OPTS=-Xms512m -Xmx1536m -XX:+UseG1GC -XX:MaxGCPauseMillis=150 -XX:+UseStringDeduplication -Djava.awt.headless=true -Duser.timezone=America/Lima -Dfile.encoding=UTF-8
    volumes:
      - backup_data:/backups
    networks:
      - reciclame-net

  reciclame-app3:
    image: kent10029/reciclame:latest
    container_name: reciclame-app3
    platform: linux/amd64
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - MINIO_URL=${MINIO_URL}
      - MINIO_INTERNAL_URL=${MINIO_INTERNAL_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - KKFILEVIEW_URL=${KKFILEVIEW_URL}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_CHATBOT_WEBHOOK_URL=${N8N_CHATBOT_WEBHOOK_URL}
      - APP_BASE_URL=${APP_BASE_URL}
      - APP_KK_ACCESSIBLE_URL=${APP_KK_ACCESSIBLE_URL}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT}
      - APP_BACKUP_PATH=${APP_BACKUP_PATH}
      - VERIFICA_API_KEY=${VERIFICA_API_KEY}
      - ATENEA_API_KEY=${ATENEA_API_KEY}
      - CENTRIFUGO_API_URL=${CENTRIFUGO_API_URL}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY}
      - CENTRIFUGO_SECRET=${CENTRIFUGO_SECRET}
      - CENTRIFUGO_WS_URL=${CENTRIFUGO_WS_URL}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - JAVA_OPTS=-Xms512m -Xmx1536m -XX:+UseG1GC -XX:MaxGCPauseMillis=150 -XX:+UseStringDeduplication -Djava.awt.headless=true -Duser.timezone=America/Lima -Dfile.encoding=UTF-8
    volumes:
      - backup_data:/backups
    networks:
      - reciclame-net

  redis:
    image: redis:7.4-alpine
    container_name: reciclame-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - reciclame-net

  nginx:
    image: nginx:1.25.4-alpine
    container_name: nginx_lb
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./favicon.ico:/usr/share/nginx/html/favicon.ico:ro
    depends_on:
      - reciclame-app1
      - reciclame-app2
      - reciclame-app3
    networks:
      - reciclame-net

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      DB_SQLITE_FILE: ${DB_SQLITE_FILE}
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - reciclame-net

  n8n:
    image: n8nio/n8n:latest
    container_name: reciclame-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - reciclame-net

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: reciclame-centrifugo
    restart: unless-stopped
    # NO se expone al host: el browser llega via nginx-proxy-manager (wss://...)
    # Solo accesible internamente desde la red reciclame-net.
    expose:
      - "8000"
    environment:
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS}
      CENTRIFUGO_ALLOW_SUBSCRIBE_FOR_CLIENT: "true"
      CENTRIFUGO_ALLOW_SUBSCRIBE_FOR_ANONYMOUS: "false"
    command: centrifugo --health --log_level=info
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - reciclame-net

  minio:
    image: minio/minio:latest
    container_name: reciclame-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - reciclame-net

  minio-init:
    image: minio/mc:latest
    container_name: reciclame-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - reciclame-net
    entrypoint: >
      /bin/sh -c " mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/${MINIO_BUCKET} && mc anonymous set none local/${MINIO_BUCKET} && echo 'Bucket ${MINIO_BUCKET} listo (acceso privado, URLs firmadas via Spring).' && exit 0 "

  kkfileview:
    image: keking/kkfileview:latest
    container_name: reciclame-kkfileview
    expose:
      - "8012"
    depends_on:
      - minio-init
    environment:
      - KK_HTTP_PREVIEW=${KK_HTTP_PREVIEW}
      - SPRING_FREEMARKER_TEMPLATE_LOADER_PATH=${SPRING_FREEMARKER_TEMPLATE_LOADER_PATH}
      - KK_CACHE_ENABLED=true
      - KK_OFFICE_PREVIEW_SWITCH_ROW=true
      - KK_OFFICE_PREVIEW_SWITCH_PPT=true
      - KK_OFFICE_PREVIEW_SWITCH_PDF=true
      - KK_OFFICE_PREVIEW_SWITCH_XLS=true
      - KK_MAX_FILE_SIZE=200MB
      - JAVA_OPTS=-Xms512m -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    volumes:
      - ./kkfileview-templates/web:/opt/kkFileView/templates/web
      - kkfileview_cache:/opt/kkFileView/file
      - kkfileview_cache_index:/opt/kkFileView/index
    healthcheck:
      # kkfileview responde en / con HTML, pero /index es estable.
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8012/ >/dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - reciclame-net

networks:
  reciclame-net:
    driver: bridge

volumes:
  minio_data:
  n8n_data:
  npm_data:
  npm_letsencrypt:
  redis_data:
  backup_data:
  kkfileview_cache:
  kkfileview_cache_index:
