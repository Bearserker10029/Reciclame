<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recíclame — Auditoría Global</title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>if (typeof navTo === 'undefined') { function navTo(p) { var map = { 'admin-docs': 'documentos' }; window.location.href = '/superadmin/' + (map[p] || p); } }</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #F5F6FA;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(46, 204, 113, .4)
      }

      50% {
        box-shadow: 0 0 0 8px rgba(46, 204, 113, 0)
      }
    }

    .hero-section {
      background: linear-gradient(135deg, #1B3A5C 0%, #0f2540 60%, #1a5c3a 100%);
      border-radius: 20px;
      padding: 28px 32px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(27, 58, 92, .35);
      animation: fadeUp .4s ease both;
    }

    .hero-section::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46, 204, 113, .25) 0%, transparent 70%);
    }

    .hero-section::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: 20%;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 152, 219, .2) 0%, transparent 70%);
    }

    .hero-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(46, 204, 113, .2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      animation: pulse 2s ease infinite;
    }

    .hero-icon i {
      font-size: 22px;
      color: #2ECC71;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }

    .hero-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, .7);
      position: relative;
      z-index: 1;
    }

    .alert-badge {
      background: rgba(231, 76, 60, .1);
      border: 1px solid rgba(231, 76, 60, .25);
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .alert-dot {
      width: 8px;
      height: 8px;
      background: #E74C3C;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }

    .filter-bar {
      background: #fff;
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-bar .search-box {
      position: relative;
      flex: 1;
      min-width: 200px;
    }

    .filter-bar .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #9CA3AF;
      font-size: 13px;
    }

    .filter-bar .search-box input {
      padding-left: 36px;
    }

    .table-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      overflow: hidden;
    }

    .pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }

    .pill-login-failed {
      background: rgba(231, 76, 60, .12);
      color: #C0392B;
    }

    .pill-impersonation {
      background: rgba(243, 156, 18, .12);
      color: #D68910;
    }

    .pill-role-change {
      background: rgba(52, 152, 219, .12);
      color: #2471A3;
    }

    .pill-doc-deleted {
      background: rgba(231, 76, 60, .12);
      color: #C0392B;
    }

    .pill-account-deactivated {
      background: rgba(149, 165, 166, .14);
      color: #717D7E;
    }

    .pill-ok {
      background: rgba(46, 204, 113, .12);
      color: #27AE60;
    }

    .pill-blocked {
      background: rgba(231, 76, 60, .12);
      color: #C0392B;
    }
  </style>
</head>

<body>
  <div style="display:flex;flex-direction:column;min-height:100vh;">
    <th:block th:replace="navbar/topbar :: topbar"></th:block>
    <div style="display:flex;flex:1;min-height:calc(100vh - 64px);">
      <th:block th:replace="navbar/sidebar :: sidebar"></th:block>
      <main style="flex:1;background:#F5F6FA;overflow-y:auto;padding:32px;">

        <div class="hero-section">
          <div class="hero-icon"><i class="fas fa-shield-alt"></i></div>
          <h1 class="hero-title">Panel de Auditoría Global</h1>
          <p class="hero-subtitle">Eventos críticos de seguridad en tiempo real</p>
          <div
            style="position:absolute;top:20px;right:20px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 70%);">
          </div>
          <div
            style="position:absolute;bottom:-40px;right:40px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(46,204,113,.15) 0%,transparent 70%);">
          </div>
        </div>

<div
            style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;animation:fadeUp .5s ease both;">
            <div class="alert-badge">
              <span class="alert-dot"></span>
              <span style="font-size:12px;font-weight:600;color:#E74C3C;"
                th:text="${auditorias != null ? auditorias.size() + ' eventos' : '0 eventos'}">0 eventos</span>
            </div>
            <a href="/superadmin/auditoria/export.xlsx"
               style="padding:9px 18px;border-radius:8px;border:none;background:#1B3A5C;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;text-decoration:none;">
              <i class="fas fa-file-excel"></i> Exportar XLSX
            </a>
          </div>

          <div th:if="${auditorias != null and !auditorias.isEmpty()}"
            style="background:rgba(231,76,60,.06);border:1px solid rgba(231,76,60,.25);border-radius:10px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px;animation:slideDown .35s ease both;">
            <div
              style="width:40px;height:40px;border-radius:50%;background:#E74C3C;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <i class="fas fa-exclamation-triangle" style="color:#fff;font-size:16px;"></i>
            </div>
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:700;color:#C0392B;margin-bottom:3px;"
                th:text="${totalElements != null ? totalElements + ' eventos de auditoría registrados' : 'Eventos de auditoría'}">Eventos de auditoría</div>
              <div style="font-size:12px;color:#6B7280;">Registros de actividad del sistema</div>
            </div>
          </div>

        <div class="filter-bar">
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input class="form-control" placeholder="Buscar por usuario o IP..." />
          </div>
          <select class="form-control" style="width:auto;padding:10px 14px;">
            <option>Tipo: Todos</option>
            <option>Login fallido</option>
            <option>Cambio de rol</option>
            <option>Cuenta desactivada</option>
            <option>Doc. eliminado</option>
            <option>Impersonación</option>
          </select>
          <select class="form-control" style="width:auto;padding:10px 14px;">
            <option>Últimas 24h</option>
            <option>Última semana</option>
            <option>Rango personalizado</option>
          </select>
        </div>

        <div class="table-card">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Tipo evento</th>
                <th>Usuario / IP</th>
                <th>Descripción</th>
                <th>Resultado</th>
              </tr>
            </thead>
            <tbody id="tabla-auditoria">
              <tr th:if="${auditorias == null or auditorias.isEmpty()}">
                <td colspan="5" style="text-align:center;padding:60px;">
                  <i class="fas fa-clipboard-list" style="font-size:44px;color:#E5E7EB;display:block;margin-bottom:16px;"></i>
                  <div style="font-size:15px;font-weight:600;color:#9CA3AF;">No hay eventos de auditoría aún</div>
                </td>
              </tr>
              <tr th:each="a : ${auditorias}">
                <td style="color:#9CA3AF;font-size:11px;white-space:nowrap;"
                  th:text="${a.fechaAccion != null ? a.fechaAccion.toString().replace('T',' ').substring(0,19) : '—'}">—</td>
                <td>
                  <span class="pill"
                    th:classappend="${a.estado != null and a.estado == 'FALLIDO'} ? 'pill-login-failed' : (${a.modulo == 'SEGURIDAD'} ? 'pill-impersonation' : 'pill-ok')"
                    th:text="${a.accion ?: '—'}">—</span>
                </td>
                <td style="font-size:12px;">
                  <div style="color:#374151;" th:text="${a.usuarioNombre ?: 'Sistema'}">—</div>
                  <div style="color:#9CA3AF;" th:text="${a.ipAddress ?: 'N/A'}">—</div>
                </td>
                <td style="font-size:12px;color:#6B7280;" th:text="${a.descripcion ?: '—'}">—</td>
                <td>
                  <span class="pill"
                    th:classappend="${a.estado == 'EXITOSO'} ? 'pill-ok' : 'pill-blocked'"
                    th:text="${a.estado == 'EXITOSO'} ? 'OK' : (${a.estado ?: 'Fallido'})">—</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
    <th:block th:replace="components/chatbot :: chatbot"></th:block>
  </div>
</body>

</html>
