<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recíclame — Editar Parámetro</title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #F5F6FA;
    }

    @keyframes waterWave {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, .5); }
      60% { box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
    }

    .water-bg {
      position: relative;
      overflow: hidden;
    }

    .water-bg::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(135deg, rgba(46,204,113,0.15) 0%, transparent 50%),
        linear-gradient(225deg, rgba(52,152,219,0.12) 0%, transparent 50%),
        linear-gradient(315deg, rgba(41,128,185,0.1) 0%, transparent 50%),
        linear-gradient(45deg, rgba(27,58,92,0.08) 0%, transparent 50%);
      background-size: 400% 400%;
      animation: waterWave 12s ease infinite;
      pointer-events: none;
      z-index: 0;
      border-radius: inherit;
    }

    .water-bg > * {
      position: relative;
      z-index: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-radius: 8px;
      cursor: pointer;
      color: rgba(255, 255, 255, .65);
      font-size: 14px;
      font-weight: 500;
      transition: background .18s;
      border-left: 3px solid transparent;
      user-select: none;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .07);
      color: #fff;
    }

    .nav-item.active {
      background: rgba(46, 204, 113, .18);
      color: #fff;
      border-left-color: #2ECC71;
    }

    .nav-sublist {
      margin: 4px 0 6px 34px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-subitem {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: rgba(255, 255, 255, .65);
      font-size: 13px;
      font-weight: 500;
      transition: background .15s, color .15s;
    }

    .nav-subitem:hover {
      background: rgba(255, 255, 255, .07);
      color: #fff;
    }

    .form-label-custom {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      display: block;
    }

    .form-control-custom {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      color: #111827;
      background: #fff;
      outline: none;
      transition: border .15s, box-shadow .15s;
    }

    .form-control-custom:focus {
      border-color: #1B3A5C;
      box-shadow: 0 0 0 3px rgba(27, 58, 92, .08);
    }

    .form-control-custom[readonly] {
      background: #F9FAFB;
      color: #6B7280;
      cursor: not-allowed;
    }

    .btn-guardar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      background: #1B3A5C;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background .15s;
    }

    .btn-guardar:hover {
      background: #153050;
    }

    .btn-cancelar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #E5E7EB;
      background: #fff;
      color: #374151;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      transition: background .15s;
    }

    .btn-cancelar:hover {
      background: #F9FAFB;
    }

    .badge-tipo {
      background: rgba(52, 152, 219, .1);
      color: #2471A3;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .warning-box {
      background: rgba(243, 156, 18, .08);
      border: 1px solid rgba(243, 156, 18, .3);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12px;
      color: #92651A;
    }

    .input-error {
      border-color: #E74C3C !important;
    }

    .error-message {
      color: #E74C3C;
      font-size: 12px;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>

<body>

  <div style="display:flex;flex-direction:column;min-height:100vh;">
    <th:block th:replace="~{navbar/topbar :: topbar}"></th:block>
    <div style="display:flex;flex:1;min-height:calc(100vh - 64px);">
      <th:block th:replace="~{navbar/sidebar :: sidebar}"></th:block>
      <main
        class="water-bg"
        style="flex:1;background: url('https://reciclame.org/wp-content/uploads/2025/12/1-Poryecto-reciclaje.jpg') no-repeat center center fixed; background-size: cover;overflow-y:auto;padding:32px;">

        <!-- Hero -->
        <div style="background:linear-gradient(135deg,#1B3A5C 0%,#0d2035 55%,#0e3322 100%);border-radius:20px;padding:26px 32px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 10px 48px rgba(27,58,92,.4);animation:fadeUp .4s ease both;">
          <div style="position:absolute;top:-80px;right:-40px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(46,204,113,.18) 0%,transparent 70%);"></div>
          <div style="position:relative;z-index:1;display:flex;align-items:center;gap:14px;">
            <a href="/superadmin/parametros" style="width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;transition:background .2s;" onmouseover="this.style.background='rgba(255,255,255,.25)'" onmouseout="this.style.background='rgba(255,255,255,.15)'">
              <i class="fas fa-arrow-left" style="font-size:15px;"></i>
            </a>
            <div style="width:44px;height:44px;border-radius:12px;background:rgba(46,204,113,.2);display:flex;align-items:center;justify-content:center;animation:pulse 2s ease infinite;">
              <i class="fas fa-sliders-h" style="color:#2ECC71;font-size:18px;"></i>
            </div>
            <div>
              <h1 style="font-size:22px;font-weight:800;color:#fff;margin:0;">Editar Parámetro</h1>
              <p style="font-size:12px;color:rgba(255,255,255,.6);margin:0;" th:text="${parametro.clave}">CLAVE</p>
            </div>
          </div>
        </div>

        <!-- Card formulario -->
        <div style="background:rgba(255,255,255,0.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.5);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:680px;">
          <div style="padding:20px 24px;border-bottom:1px solid #F3F4F6;display:flex;align-items:center;gap:8px;">
            <i class="fas fa-pencil-alt" style="color:#2ECC71;font-size:14px;"></i>
            <span style="font-weight:700;font-size:15px;color:#1B3A5C;">Datos del parámetro</span>
            <span class="badge-tipo" th:text="${parametro.tipoDato}" style="margin-left:auto;">STRING</span>
          </div>

          <form th:action="@{/superadmin/parametros/editar/{id}(id=${parametro.id})}" method="post"
            style="padding:24px;display:flex;flex-direction:column;gap:20px;">

            <!-- Clave (read-only) -->
            <div>
              <label class="form-label-custom">Clave <span style="color:#9CA3AF;font-weight:400;">(no
                  editable)</span></label>
              <input type="text" class="form-control-custom" readonly th:value="${parametro.clave}" />
            </div>

            <!-- Valor -->
            <div>
              <label class="form-label-custom">
                Valor <span style="color:#E74C3C;">*</span>
              </label>
              <textarea name="valor" rows="3" class="form-control-custom" required style="resize:vertical;"
                th:classappend="${error_valor != null} ? 'input-error'"
                th:text="${parametro.valor}"></textarea>
              <span class="error-message" th:if="${error_valor}" th:text="${error_valor}"></span>
            </div>

            <!-- Descripción -->
            <div>
              <label class="form-label-custom">Descripción</label>
              <input type="text" name="descripcion" class="form-control-custom"
                th:classappend="${error_descripcion != null} ? 'input-error'"
                th:value="${parametro.descripcion}"
                placeholder="Descripción del parámetro..." maxlength="300" />
              <span class="error-message" th:if="${error_descripcion}" th:text="${error_descripcion}"></span>
            </div>

            <!-- Estado activo -->
            <div
              style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:#F9FAFB;border-radius:8px;border:1px solid #F3F4F6;">
              <input type="checkbox" name="estadoActivo" id="estadoActivo" value="true"
                style="width:16px;height:16px;accent-color:#1B3A5C;cursor:pointer;"
                th:checked="${parametro.estadoActivo}" />
              <label for="estadoActivo" style="font-size:13px;font-weight:600;color:#374151;cursor:pointer;margin:0;">
                Parámetro activo
              </label>
              <span style="font-size:12px;color:#9CA3AF;margin-left:4px;">— desactivar lo excluye del procesamiento del
                sistema</span>
            </div>

            <!-- Advertencia -->
            <div class="warning-box">
              <i class="fas fa-exclamation-triangle" style="color:#F39C12;flex-shrink:0;margin-top:1px;"></i>
              <span>Los cambios en parámetros del sistema tienen efecto inmediato en producción. Verifica el valor antes
                de guardar.</span>
            </div>

            <!-- Acciones -->
            <div style="display:flex;gap:12px;padding-top:4px;">
              <button type="submit" class="btn-guardar">
                <i class="fas fa-save"></i> Guardar cambios
              </button>
              <a href="/superadmin/parametros" class="btn-cancelar">
                <i class="fas fa-arrow-left"></i> Cancelar
              </a>
            </div>

          </form>
        </div>

      <th:block th:replace="~{navbar/footer :: footer}"></th:block>
      </main>
    </div>
  </div>

  <script>
    function navTo(page) {
      var map = {
        'inicio': '/superadmin/inicio',
        'estudios': '/superadmin/estudios',
        'normativo': '/superadmin/normativo',
        'perfil': '/superadmin/perfil',
        'notificaciones': '/superadmin/notificaciones',
        'usuarios': '/superadmin/usuarios',
        'admin-docs': '/superadmin/documentos',
        'trazabilidad': '/superadmin/trazabilidad',
        'reportes': '/superadmin/reportes',
        'auditoria': '/superadmin/auditoria',
        'impersonar': '/superadmin/impersonar',
        'parametros': '/superadmin/parametros'
      };
      window.location.href = map[page] || ('/superadmin/' + page);
    }
  </script>

</body>

</html>
