<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recíclame — Panel de Documentos</title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>if (typeof navTo === 'undefined') { function navTo(p) { var map = { 'admin-docs': 'documentos' }; window.location.href = '/superadmin/' + (map[p] || p); } }</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #F0F4F8;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(46, 204, 113, .4)
      }

      50% {
        box-shadow: 0 0 0 8px rgba(46, 204, 113, 0)
      }
    }

    @keyframes glowGreen {

      0%,
      100% {
        box-shadow: 0 4px 20px rgba(46, 204, 113, .15)
      }

      50% {
        box-shadow: 0 4px 32px rgba(46, 204, 113, .4)
      }
    }

    .doc-hero {
      background: linear-gradient(135deg, #1B3A5C 0%, #0f2540 60%, #1a5c3a 100%);
      border-radius: 20px;
      padding: 28px 32px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(27, 58, 92, .35);
      animation: fadeUp .4s ease both;
    }

    .doc-hero::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46, 204, 113, .25) 0%, transparent 70%);
    }

    .doc-hero::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: 20%;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 152, 219, .2) 0%, transparent 70%);
    }

    .stat-card {
      background: rgba(255, 255, 255, .12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 14px;
      padding: 14px 20px;
      text-align: center;
      cursor: default;
      transition: all .3s ease;
      animation: fadeUp .5s ease both;
    }

    .stat-card:hover {
      background: rgba(255, 255, 255, .22);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
    }

    .stat-card .val {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }

    .stat-card .lbl {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .65);
      margin-top: 4px;
    }

    .filter-bar {
      background: #fff;
      border-radius: 14px;
      padding: 14px 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, .07);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      animation: fadeUp .5s .1s ease both;
    }

    .filter-bar input {
      flex: 1;
      min-width: 200px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      padding: 9px 14px 9px 38px;
      font-size: 13px;
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
      color: #374151;
    }

    .filter-bar input:focus {
      outline: none;
      border-color: #2ECC71;
      box-shadow: 0 0 0 3px rgba(46, 204, 113, .12);
    }

    .filter-bar select {
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-family: inherit;
      color: #374151;
      cursor: pointer;
      background: #fff;
      transition: border-color .2s;
    }

    .filter-bar select:focus {
      outline: none;
      border-color: #2ECC71;
    }

    .table-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 20px rgba(0, 0, 0, .08);
      overflow: hidden;
      animation: fadeUp .5s .15s ease both;
    }

    .table-card table thead {
      background: linear-gradient(90deg, #F8FAFC, #F0F4F8);
    }

    .table-card table thead th {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #6B7280;
      padding: 14px 16px;
      border: none;
    }

    .table-card table tbody tr {
      transition: background .2s, transform .2s;
      border-bottom: 1px solid #F3F4F6;
    }

    .table-card table tbody tr:hover {
      background: #F0FFF6;
      transform: scale(1.002);
    }

    .table-card table tbody td {
      padding: 13px 16px;
      vertical-align: middle;
    }

    .badge-pdf {
      background: rgba(231, 76, 60, .1);
      color: #C0392B;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }

    .badge-pptx {
      background: rgba(52, 152, 219, .1);
      color: #2471A3;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }

    .badge-solo {
      background: rgba(156, 163, 175, .12);
      color: #6B7280;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
    }

    .badge-publico {
      background: rgba(46, 204, 113, .1);
      color: #27AE60;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }

    .badge-restringido {
      background: rgba(156, 163, 175, .12);
      color: #6B7280;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
    }

    .btn-agregar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 10px;
      border: 1.5px solid #2ECC71;
      background: rgba(46, 204, 113, .07);
      color: #27AE60;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all .25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-agregar:hover {
      background: #2ECC71;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(46, 204, 113, .4);
      animation: glowGreen 1.5s ease infinite;
    }

    .btn-agregar:hover::after {
      transform: translateX(100%);
    }

    .btn-agregar:active {
      transform: translateY(0);
    }

    .btn-upload {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: #2ECC71;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all .25s ease;
      box-shadow: 0 4px 14px rgba(46, 204, 113, .3);
    }

    .btn-upload:hover {
      background: #27AE60;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(46, 204, 113, .4);
    }
  </style>
</head>

<body>
  <div style="display:flex;flex-direction:column;min-height:100vh;">
    <th:block th:replace="navbar/topbar :: topbar"></th:block>
    <div style="display:flex;flex:1;min-height:calc(100vh - 64px);">
      <th:block th:replace="navbar/sidebar :: sidebar"></th:block>
      <main style="flex:1;background:#F0F4F8;overflow-y:auto;padding:32px;">

        <div class="doc-hero">
          <div
            style="position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:20px;">
            <div>
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
                <div
                  style="width:44px;height:44px;border-radius:12px;background:rgba(46,204,113,.2);display:flex;align-items:center;justify-content:center;animation:pulse 2s ease infinite;">
                  <i class="fas fa-file-alt" style="color:#2ECC71;font-size:18px;"></i>
                </div>
                <div>
                  <h1 style="font-size:22px;font-weight:800;color:#fff;margin:0;">Panel de Documentos</h1>
                  <p style="font-size:12px;color:rgba(255,255,255,.65);margin:0;">Gestiona estudios y normativas del
                    repositorio</p>
                </div>
              </div>
            </div>
            <button class="btn-upload" style="animation:fadeUp .5s .1s ease both;">
              <i class="fas fa-cloud-upload-alt"></i> Subir documento
            </button>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;">
          <div class="stat-card" style="animation-delay:.1s">
            <div class="val" th:text="${estudios != null ? estudios.size() : 0}">0</div>
            <div class="lbl">Estudios cargados</div>
          </div>
          <div class="stat-card" style="animation-delay:.2s">
            <div class="val" th:text="${normativas != null ? normativas.size() : 0}">0</div>
            <div class="lbl">Normativas indexadas</div>
          </div>
          <div class="stat-card" style="animation-delay:.3s">
            <div class="val" th:text="${totalDescargas != null ? totalDescargas : 0}">0</div>
            <div class="lbl">Descargas totales</div>
          </div>
          <div class="stat-card" style="animation-delay:.4s">
            <div class="val" th:text="${estudios != null ? estudios.size() : 0}">0</div>
            <div class="lbl">Documentos totales</div>
          </div>
        </div>

        <div class="filter-bar">
          <div style="position:relative;flex:1;min-width:200px;">
            <i class="fas fa-search"
              style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9CA3AF;font-size:13px;pointer-events:none;"></i>
            <input id="search-docs" placeholder="Buscar documentos..." oninput="filtrarDocumentos()" />
          </div>
          <select id="filter-seccion" onchange="filtrarDocumentos()">
            <option value="">Sección: Todas</option>
            <option value="Estudio">Estudios</option>
            <option value="Normativa">Repositorio Normativo</option>
          </select>
          <select id="filter-categoria" onchange="filtrarDocumentos()">
            <option value="">Categoría: Todas</option>
            <option value="EC">EC</option>
            <option value="GR">GR</option>
            <option value="EE">EE</option>
            <option value="REP">REP</option>
          </select>
          <button onclick="limpiarFiltrosDocumentos()"
            style="padding:9px 16px;border-radius:10px;border:1.5px solid #E5E7EB;background:#fff;cursor:pointer;font-size:12px;color:#6B7280;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:6px;"
            onmouseover="this.style.borderColor='#E74C3C';this.style.color='#E74C3C'"
            onmouseout="this.style.borderColor='#E5E7EB';this.style.color='#6B7280'">
            <i class="fas fa-times"></i> Limpiar
          </button>
        </div>

        <div class="table-card">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Año</th>
                <th>Formatos</th>
                <th>Acceso</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="documentos-tbody">
              <tr th:each="e : ${estudios}" class="doc-row" th:data-nombre="${e.titulo}" th:data-seccion="Estudio" th:data-categoria="${e.tematicaCodigo}">
                <td style="font-weight:600;color:#1B3A5C;">
                  <span style="background:rgba(46,204,113,.1);color:#27AE60;margin-right:6px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;">Estudio</span>
                  <span th:text="${e.titulo}">—</span>
                </td>
                <td style="color:#6B7280;font-size:12px;max-width:240px;" th:text="${e.descripcionBreve}">—</td>
                <td th:text="${e.anio}">—</td>
                <td>
                  <div style="display:flex;gap:4px;">
                    <span class="badge-pdf">PDF</span>
                  </div>
                </td>
                <td><span class="badge-solo"><i class="fas fa-eye" style="font-size:8px;"></i> Solo lectura</span></td>
                <td>
                  <div style="display:flex;gap:6px;">
                    <button style="padding:5px 10px;border-radius:6px;border:1px solid #E5E7EB;background:#fff;cursor:pointer;font-size:11px;font-family:inherit;"><i class="fas fa-edit" style="color:#3498DB;"></i></button>
                    <button style="padding:5px 10px;border-radius:6px;border:1px solid #E5E7EB;background:#fff;cursor:pointer;font-size:11px;color:#E74C3C;font-family:inherit;"><i class="fas fa-trash-alt"></i></button>
                  </div>
                </td>
              </tr>
              <tr th:each="n : ${normativas}" class="doc-row" th:data-nombre="${n.titulo}" th:data-seccion="Normativa" th:data-categoria="${n.tematicaCodigo}">
                <td style="font-weight:600;color:#1B3A5C;">
                  <span style="background:rgba(52,152,219,.1);color:#2471A3;margin-right:6px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;">Normativa</span>
                  <span th:text="${n.titulo}">—</span>
                </td>
                <td style="color:#6B7280;font-size:12px;max-width:240px;" th:text="${n.descripcionBreve}">—</td>
                <td th:text="${n.anio}">—</td>
                <td>
                  <div style="display:flex;gap:4px;">
                    <span class="badge-pdf">PDF</span>
                  </div>
                </td>
                <td><span class="badge-publico"><i class="fas fa-globe" style="font-size:8px;"></i> Público</span></td>
                <td>
                  <div style="display:flex;gap:6px;">
                    <button style="padding:5px 10px;border-radius:6px;border:1px solid #E5E7EB;background:#fff;cursor:pointer;font-size:11px;font-family:inherit;"><i class="fas fa-edit" style="color:#3498DB;"></i></button>
                    <button style="padding:5px 10px;border-radius:6px;border:1px solid #E5E7EB;background:#fff;cursor:pointer;font-size:11px;color:#E74C3C;font-family:inherit;"><i class="fas fa-trash-alt"></i></button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <script>
          function filtrarDocumentos() {
            var texto = document.getElementById('search-docs')?.value.toLowerCase().trim() || '';
            var seccion = document.getElementById('filter-seccion')?.value.toLowerCase().trim() || '';
            var categoria = document.getElementById('filter-categoria')?.value.toLowerCase().trim() || '';

            document.querySelectorAll('.doc-row').forEach(function (row) {
              var nombre = (row.dataset.nombre || '').toLowerCase();
              var rowSeccion = (row.dataset.seccion || '').toLowerCase();
              var rowCategoria = (row.dataset.categoria || '').toLowerCase();

              var matchTexto = !texto || nombre.includes(texto);
              var matchSeccion = !seccion || rowSeccion === seccion;
              var matchCategoria = !categoria || rowCategoria === categoria;

              if (matchTexto && matchSeccion && matchCategoria) {
                row.style.display = '';
              } else {
                row.style.display = 'none';
              }
            });
          }

          function limpiarFiltrosDocumentos() {
            document.getElementById('search-docs').value = '';
            document.getElementById('filter-seccion').value = '';
            document.getElementById('filter-categoria').value = '';
            filtrarDocumentos();
          }
        </script>

      </main>
    </div>
    <th:block th:replace="components/chatbot :: chatbot"></th:block>
  </div>
</body>

</html>
