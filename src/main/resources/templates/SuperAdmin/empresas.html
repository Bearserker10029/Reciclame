<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recíclame — Gestión de Empresas</title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    if (typeof navTo === 'undefined') {
      function navTo(page) {
        window.location.href = '/superadmin/' + page;
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F5F6FA; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .hero-section {
      background: linear-gradient(135deg, #1B3A5C 0%, #2C4A6E 50%, #1B3A5C 100%);
      border-radius: 16px; padding: 32px; margin-bottom: 24px;
      position: relative; overflow: hidden; animation: fadeUp .4s ease-out;
    }
    .hero-section::before {
      content: ''; position: absolute; top: -50px; right: -50px;
      width: 200px; height: 200px; background: rgba(46, 204, 113, .15);
      border-radius: 50%; filter: blur(40px);
    }
    .hero-icon {
      width: 56px; height: 56px; background: rgba(46, 204, 113, .2);
      border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
    }
    .hero-icon i { font-size: 24px; color: #2ECC71; }
    .hero-title { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 6px; }
    .hero-subtitle { font-size: 13px; color: rgba(255, 255, 255, .7); }
    .btn-nueva-empresa {
      padding: 12px 20px; border-radius: 10px; border: none;
      background: #2ECC71; color: #fff; font-weight: 600; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      transition: all .25s ease; box-shadow: 0 4px 14px rgba(46, 204, 113, .3);
    }
    .btn-nueva-empresa:hover { background: #27AE60; transform: translateY(-2px); }
    .filter-bar {
      background: #fff; border-radius: 12px; padding: 16px 20px;
      margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
      display: flex; align-items: center; gap: 12px;
    }
    .filter-bar input {
      flex: 1; min-width: 200px; border: 1.5px solid #E5E7EB; border-radius: 10px;
      padding: 10px 14px 10px 38px; font-size: 13px;
    }
    .filter-bar input:focus { outline: none; border-color: #2ECC71; box-shadow: 0 0 0 3px rgba(46, 204, 113, .12); }
    .badge-activo { background: rgba(46, 204, 113, .1); color: #27AE60; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge-inactivo { background: rgba(156, 163, 175, .12); color: #6B7280; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .btn-editar { padding: 6px 12px; border-radius: 6px; border: 1px solid #E5E7EB; background: #fff; cursor: pointer; font-size: 12px; }
    .btn-editar i { color: #3498DB; }
    .btn-eliminar { padding: 6px 12px; border-radius: 6px; border: 1px solid #E5E7EB; background: #fff; cursor: pointer; font-size: 12px; }
    .btn-eliminar i { color: #E74C3C; }
  </style>
</head>

<body>
  <div style="display:flex;flex-direction:column;min-height:100vh;">
    <th:block th:replace="navbar/topbar :: topbar"></th:block>
    <div style="display:flex;flex:1;min-height:calc(100vh - 64px);">
      <th:block th:replace="navbar/sidebar :: sidebar"></th:block>
      <main style="flex:1;background:#F5F6FA;overflow-y:auto;padding:32px;">

        <div class="hero-section">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;">
            <div>
              <div class="hero-icon">
                <i class="fas fa-building"></i>
              </div>
              <h1 class="hero-title">Gestión de Empresas</h1>
              <p class="hero-subtitle">Administra las empresas registradas en el sistema</p>
            </div>
            <a href="/superadmin/empresas/nueva" class="btn-nueva-empresa">
              <i class="fas fa-plus"></i> Nueva Empresa
            </a>
          </div>
        </div>

        <div th:if="${mensaje != null}" style="background:rgba(46,204,113,.1);border:1px solid #2ECC71;border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:10px;">
          <i class="fas fa-check-circle" style="color:#27AE60;"></i>
          <span style="color:#27AE60;font-size:13px;font-weight:600;" th:text="${mensaje}"></span>
        </div>

        <div th:if="${error != null}" style="background:rgba(231,76,60,.1);border:1px solid #E74C3C;border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:10px;">
          <i class="fas fa-exclamation-circle" style="color:#E74C3C;"></i>
          <span style="color:#E74C3C;font-size:13px;font-weight:600;" th:text="${error}"></span>
        </div>

        <div class="filter-bar">
          <div style="position:relative;flex:1;min-width:200px;">
            <i class="fas fa-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9CA3AF;font-size:13px;"></i>
            <input id="buscar-empresa" placeholder="Buscar por RUC o razón social..." onkeyup="filtrarEmpresas()" />
          </div>
        </div>

        <div style="background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden;">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>RUC</th>
                <th>Razón Social</th>
                <th>Sector</th>
                <th>Estado</th>
                <th>Fecha Registro</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody-empresas">
              <tr th:each="empresa : ${empresas}" th:data-ruc="${empresa.ruc}" th:data-razon="${empresa.razonSocial?.toLowerCase()}">
                <td style="font-weight:600;color:#1B3A5C;" th:text="${empresa.ruc}">—</td>
                <td>
                  <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:36px;height:36px;border-radius:8px;background:#1B3A5C;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;"
                      th:text="${empresa.razonSocial != null ? #strings.toUpperCase(#strings.substring(empresa.razonSocial, 0, 2)) : '??'}">??</div>
                    <span th:text="${empresa.razonSocial}">—</span>
                  </div>
                </td>
                <td style="color:#6B7280;font-size:13px;" th:text="${empresa.sector ?: '—'}">—</td>
                <td>
                  <span class="badge-activo" th:if="${empresa.estadoActivo}">Activa</span>
                  <span class="badge-inactivo" th:unless="${empresa.estadoActivo}">Inactiva</span>
                </td>
                <td style="color:#9CA3AF;font-size:12px;" th:text="${empresa.createdAt != null ? #temporals.format(empresa.createdAt, 'dd/MM/yyyy') : '—'}">—</td>
                <td>
                  <div style="display:flex;gap:6px;">
                    <a th:href="@{/superadmin/empresas/editar/{id}(id=${empresa.id})}" class="btn-editar">
                      <i class="fas fa-edit"></i>
                    </a>
                    <form th:action="@{/superadmin/empresas/eliminar/{id}(id=${empresa.id})}" method="post" style="display:inline;" onsubmit="return confirm('¿Eliminar esta empresa?');">
                      <button type="submit" class="btn-eliminar">
                        <i class="fas fa-trash"></i>
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${empresas == null or empresas.empty}">
                <td colspan="6" style="text-align:center;padding:40px;color:#9CA3AF;">
                  <i class="fas fa-building" style="font-size:32px;margin-bottom:10px;display:block;"></i>
                  No hay empresas registradas
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <script>
          function filtrarEmpresas() {
            var texto = document.getElementById('buscar-empresa').value.toLowerCase().trim();
            document.querySelectorAll('#tbody-empresas tr[data-ruc]').forEach(function(tr) {
              var ruc = (tr.dataset.ruc || '').toLowerCase();
              var razon = (tr.dataset.razon || '');
              if (!texto || ruc.includes(texto) || razon.includes(texto)) {
                tr.style.display = '';
              } else {
                tr.style.display = 'none';
              }
            });
          }
        </script>

      </main>
    </div>
    <th:block th:replace="components/chatbot :: chatbot"></th:block>
  </div>
</body>

</html>
