<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sidebar SuperAdmin</title>
</head>
<body>
<th:block th:fragment="sidebar">
  <aside
    style="width:240px;background:#1B3A5C;display:flex;flex-direction:column;padding:16px 12px;flex-shrink:0;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;">
    <div style="flex:1;display:flex;flex-direction:column;gap:2px;">
      <!-- INICIO -->
      <div class="nav-item" id="nav-inicio" onclick="navTo('inicio')">
        <i class="fas fa-home" style="width:18px;text-align:center;font-size:15px;"></i><span>Inicio</span>
      </div>

      <!-- ESTUDIOS -->
      <div class="nav-item" id="nav-estudios" onclick="navTo('estudios')">
        <i class="fas fa-file-alt" style="width:18px;text-align:center;font-size:15px;"></i><span>Estudios</span>
      </div>

      <!-- REPOSITORIO NORMATIVO -->
      <div class="nav-item" id="nav-normativo" onclick="window.__normativoTab='todos';navTo('normativo');setTimeout(function(){if(window.showNormativoTab)window.showNormativoTab('todos');},0);">
        <i class="fas fa-balance-scale" style="width:18px;text-align:center;font-size:15px;"></i><span>Repositorio Normativo</span>
      </div>
      <div class="nav-sublist" aria-label="Submódulos de Repositorio Normativo">
        <div class="nav-subitem" id="nav-nacional" onclick="window.__normativoTab='nacional';navTo('normativo');setTimeout(function(){if(window.showNormativoTab)window.showNormativoTab('nacional');},0);">
          <i class="fas fa-flag" style="width:16px;text-align:center;font-size:13px;"></i>
          <span>Nacional</span>
        </div>
        <div class="nav-subitem" id="nav-internacional" onclick="window.__normativoTab='internacional';navTo('normativo');setTimeout(function(){if(window.showNormativoTab)window.showNormativoTab('internacional');},0);">
          <i class="fas fa-globe" style="width:16px;text-align:center;font-size:13px;"></i>
          <span>Internacional</span>
        </div>
      </div>

      <div style="height:1px;background:rgba(255,255,255,.1);margin:10px 0;"></div>

      <!-- MI PERFIL -->
      <div class="nav-item" id="nav-perfil" onclick="navTo('perfil')">
        <i class="fas fa-user" style="width:18px;text-align:center;font-size:15px;"></i><span>Mi Perfil</span>
      </div>

      <!-- NOTIFICACIONES -->
      <div class="nav-item" id="nav-notificaciones" onclick="navTo('notificaciones')" style="position:relative;cursor:pointer;">
        <i class="fas fa-bell" style="width:18px;text-align:center;font-size:15px;"></i>
        <span>Notificaciones</span>
        <span style="margin-left:auto;background:#E74C3C;color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;">3</span>
      </div>

      <!-- ADMINISTRACIÓN -->
      <div style="height:1px;background:rgba(255,255,255,.1);margin:10px 0;"></div>
      <div style="color:rgba(255,255,255,.3);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 16px;margin-bottom:4px;">
        Administración
      </div>
      <div class="nav-item" id="nav-usuarios" onclick="navTo('usuarios')">
        <i class="fas fa-users" style="width:18px;text-align:center;font-size:15px;"></i><span>Usuarios</span>
      </div>

      <!-- SUPER ADMIN -->
      <div style="height:1px;background:rgba(255,255,255,.1);margin:10px 0;"></div>
      <div style="color:rgba(255,255,255,.3);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 16px;margin-bottom:4px;">
        Super Admin
      </div>
      <div class="nav-item" id="nav-parametros" onclick="window.location.href='/superadmin/parametros'">
        <i class="fas fa-sliders-h" style="width:18px;text-align:center;font-size:15px;"></i><span>Parámetros</span>
      </div>
      <div class="nav-item" id="nav-auditoria" onclick="navTo('auditoria')">
        <i class="fas fa-shield-alt" style="width:18px;text-align:center;font-size:15px;"></i><span>Auditoría Global</span>
      </div>
      <div class="nav-item" id="nav-backups" onclick="window.location.href='/superadmin/backups'">
        <i class="fas fa-database" style="width:18px;text-align:center;font-size:15px;"></i><span>Backups</span>
      </div>
    </div>

    <!-- LOGOUT -->
    <div style="border-top:1px solid rgba(255,255,255,.1);padding-top:12px;margin-top:4px;">
      <div class="nav-item" style="color:rgba(255,255,255,.4);" onclick="window.location.href='/logout'">
        <i class="fas fa-sign-out-alt" style="width:18px;text-align:center;font-size:15px;"></i><span>Cerrar sesión</span>
      </div>
    </div>
  </aside>

  <!-- Navigation function (uses navTo from inicio.html) -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var currentPath = window.location.pathname;
      var navMap = {
        '/superadmin': 'nav-inicio',
        '/superadmin/inicio': 'nav-inicio',
        '/superadmin/estudios': 'nav-estudios',
        '/superadmin/estudios/crear': 'nav-estudios',
        '/superadmin/estudios/editar': 'nav-estudios',
        '/superadmin/normativo': 'nav-normativo',
        '/superadmin/normativo/crear': 'nav-normativo',
        '/superadmin/normativo/editar': 'nav-normativo',
        '/superadmin/perfil': 'nav-perfil',
        '/superadmin/notificaciones': 'nav-notificaciones',
        '/superadmin/usuarios': 'nav-usuarios',
        '/superadmin/auditoria': 'nav-auditoria',
        '/superadmin/parametros': 'nav-parametros',
        '/superadmin/backups': 'nav-backups'
      };

      // Eliminar clase 'active' de todos los nav-items
      document.querySelectorAll('.nav-item, .nav-subitem').forEach(function(item) {
        item.classList.remove('active');
      });

      // Buscar nav-item activo
      var activeNavId = navMap[currentPath];
      if (!activeNavId) {
        if (currentPath.startsWith('/superadmin/normativo/editar/')) activeNavId = 'nav-normativo';
        else if (currentPath.startsWith('/superadmin/normativo/crear')) activeNavId = 'nav-normativo';
        else if (currentPath.startsWith('/superadmin/estudios/editar/')) activeNavId = 'nav-estudios';
        else if (currentPath.startsWith('/superadmin/estudios/crear')) activeNavId = 'nav-estudios';
      }

      if (activeNavId) {
        var activeNav = document.getElementById(activeNavId);
        if (activeNav) {
          activeNav.classList.add('active');
        }
      }

      // Manejo especial para subitems de normativo
      if (currentPath === '/superadmin/normativo') {
        var normativoTab = window.__normativoTab || 'todos';
        if (normativoTab === 'nacional') {
          var navNacional = document.getElementById('nav-nacional');
          if (navNacional) navNacional.classList.add('active');
        } else if (normativoTab === 'internacional') {
          var navInternacional = document.getElementById('nav-internacional');
          if (navInternacional) navInternacional.classList.add('active');
        }
      }
    });

    // Monitorear cambios en __normativoTab
    var observer = setInterval(function() {
      if (window.location.pathname === '/superadmin/normativo') {
        document.querySelectorAll('.nav-subitem').forEach(function(item) {
          item.classList.remove('active');
        });

        var normativoTab = window.__normativoTab || 'todos';
        if (normativoTab === 'nacional') {
          var navNacional = document.getElementById('nav-nacional');
          if (navNacional) navNacional.classList.add('active');
        } else if (normativoTab === 'internacional') {
          var navInternacional = document.getElementById('nav-internacional');
          if (navInternacional) navInternacional.classList.add('active');
        }
      }
    }, 100);
  </script>
</th:block>
</body>
</html>
