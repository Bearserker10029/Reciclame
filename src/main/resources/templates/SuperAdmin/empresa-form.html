<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${empresa != null ? 'Editar Empresa' : 'Nueva Empresa'}">Empresa</title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    if (typeof navTo === 'undefined') {
      function navTo(page) { window.location.href = '/superadmin/' + page; }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #F5F6FA;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes waterWave {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .water-bg {
      position: relative;
      overflow: hidden;
    }

    .water-bg::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        linear-gradient(135deg, rgba(46, 204, 113, 0.15) 0%, transparent 50%),
        linear-gradient(225deg, rgba(52, 152, 219, 0.12) 0%, transparent 50%),
        linear-gradient(315deg, rgba(41, 128, 185, 0.1) 0%, transparent 50%),
        linear-gradient(45deg, rgba(27, 58, 92, 0.08) 0%, transparent 50%);
      background-size: 400% 400%;
      animation: waterWave 12s ease infinite;
      pointer-events: none;
      z-index: 0;
      border-radius: inherit;
    }

    .water-bg>* {
      position: relative;
      z-index: 1;
    }

    .hero-section {
      background: linear-gradient(135deg, #1B3A5C 0%, #0f2540 60%, #1a5c3a 100%);
      border-radius: 20px;
      padding: 26px 32px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(27, 58, 92, .35);
      animation: fadeUp .4s ease both;
    }

    .hero-section::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46, 204, 113, .25) 0%, transparent 70%);
    }

    .hero-section::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: 20%;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 152, 219, .2) 0%, transparent 70%);
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(46, 204, 113, .5);
      }

      60% {
        box-shadow: 0 0 0 10px rgba(46, 204, 113, 0);
      }
    }

    .hero-title {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .hero-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, .7);
    }

    .form-card {
      background: rgba(255, 255, 255, 0.28);


      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
      max-width: 600px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      font-size: 14px;
      color: #374151;
      transition: all .2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #2ECC71;
      box-shadow: 0 0 0 3px rgba(46, 204, 113, .12);
    }

    .btn-guardar {
      padding: 14px 28px;
      border-radius: 10px;
      border: none;
      background: #2ECC71;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all .25s;
    }

    .btn-guardar:hover {
      background: #27AE60;
      transform: translateY(-2px);
    }

    .btn-cancelar {
      padding: 14px 28px;
      border-radius: 10px;
      border: 1.5px solid #E5E7EB;
      background: #fff;
      color: #6B7280;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all .25s;
    }

    .btn-cancelar:hover {
      border-color: #9CA3AF;
      color: #374151;
    }

    .required {
      color: #E74C3C;
    }

    .input-error {
      border-color: #E74C3C !important;
    }

    .error-message {
      color: #E74C3C;
      font-size: 12px;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>

<body>
  <div style="display:flex;flex-direction:column;min-height:100vh;">
    <th:block th:replace="~{navbar/topbar :: topbar}"></th:block>
    <div style="display:flex;flex:1;min-height:calc(100vh - 64px);">
      <th:block th:replace="~{navbar/sidebar :: sidebar}"></th:block>
      <main class="water-bg"
        style="flex:1;background: url('https://reciclame.org/wp-content/uploads/2025/12/1-Poryecto-reciclaje.jpg') no-repeat center center fixed; background-size: cover;overflow-y:auto;padding:32px;">

        <div class="hero-section">
          <div style="position:relative;z-index:1;display:flex;align-items:center;gap:14px;">
            <a href="/superadmin/empresas" style="width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);
                  display:flex;align-items:center;justify-content:center;text-decoration:none;
                  color:#fff;transition:background .2s;" onmouseover="this.style.background='rgba(255,255,255,.25)'"
              onmouseout="this.style.background='rgba(255,255,255,.15)'">
              <i class="fas fa-arrow-left" style="font-size:15px;"></i>
            </a>
            <div
              style="width:44px;height:44px;border-radius:12px;background:rgba(46,204,113,.2);display:flex;align-items:center;justify-content:center;animation:pulse 2s ease infinite;">
              <i class="fas fa-building" style="color:#2ECC71;font-size:18px;"></i>
            </div>
            <div>
              <h1 style="font-size:22px;font-weight:800;color:#fff;margin:0;"
                th:text="${empresa != null ? 'Editar Empresa' : 'Nueva Empresa'}">Empresa</h1>
              <p style="font-size:12px;color:rgba(255,255,255,.6);margin:0;"
                th:text="${empresa != null ? 'Modifica los datos de la empresa' : 'Ingresa los datos de la nueva empresa'}">
              </p>
            </div>
          </div>
        </div>

        <div class="form-card">
          <form
            th:action="${empresa != null ? '/superadmin/empresas/editar/' + empresa.id : '/superadmin/empresas/guardar'}"
            method="post">
            <div class="form-group">
              <label>RUC <span class="required">*</span></label>
              <div th:if="${empresa == null}" style="display:flex;gap:8px;align-items:center;">
                <input id="input-ruc" type="text" name="ruc" required pattern="[0-9]{11}" maxlength="11"
                  th:classappend="${error_ruc != null} ? 'input-error'" placeholder="Ingrese 11 dígitos del RUC"
                  oninput="this.value=this.value.replace(/\D/g,'')" style="flex:1;" />
                <button type="button" id="btn-verificar-ruc" onclick="verificarRuc()"
                  style="padding:8px 14px;background:#1B3A5C;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;">
                  <i class="fas fa-search"></i> Verificar
                </button>
              </div>
              
              <input th:if="${empresa != null}" type="text" name="ruc" th:value="${empresa?.ruc}"
                readonly th:classappend="${error_ruc != null} ? 'input-error'" />
              <div id="ruc-feedback" style="font-size:11px;margin-top:4px;display:none;"></div>
              <small style="color:#9CA3AF;font-size:12px;" th:if="${empresa == null}">El RUC no podrá ser modificado después de crear</small>
              <span class="error-message" th:if="${error_ruc}" th:text="${error_ruc}"></span>
            </div>

            <div class="form-group">
              <label>Razón Social <span class="required">*</span></label>
              <input id="input-razon-social" type="text" name="razonSocial" th:value="${empresa?.razonSocial}" required
                minlength="3" maxlength="200"
                th:classappend="${error_razonSocial != null} ? 'input-error'" placeholder="Ingrese la razón social" />
              <span class="error-message" id="err-razon-social"
                    th:if="${error_razonSocial}" th:text="${error_razonSocial}"
                    style="display:none;"></span>
              <span class="error-message" th:if="${error_razonSocial}" th:text="${error_razonSocial}"></span>
            </div>

            <div class="form-group">
              <label>Sector</label>
              <select name="sector">
                <option value="">Seleccionar sector...</option>
                <option value="Reciclaje" th:selected="${empresa?.sector == 'Reciclaje'}">Reciclaje</option>
                <option value="Manufactura" th:selected="${empresa?.sector == 'Manufactura'}">Manufactura</option>
                <option value="Comercio" th:selected="${empresa?.sector == 'Comercio'}">Comercio</option>
                <option value="Servicios" th:selected="${empresa?.sector == 'Servicios'}">Servicios</option>
                <option value="Construcción" th:selected="${empresa?.sector == 'Construcción'}">Construcción</option>
                <option value="Agricultura" th:selected="${empresa?.sector == 'Agricultura'}">Agricultura</option>
                <option value="Otro" th:selected="${empresa?.sector == 'Otro'}">Otro</option>
              </select>
            </div>

            <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:28px;">
              <a href="/superadmin/empresas" class="btn-cancelar">Cancelar</a>
              <button type="submit" class="btn-guardar">
                <i class="fas fa-save"></i> Guardar
              </button>
            </div>
          </form>
        </div>

        <th:block th:replace="~{navbar/dock :: dock}"></th:block>
        <th:block th:replace="~{navbar/footer :: footer}"></th:block>
      </main>
    </div>
    <th:block th:replace="~{components/chatbot :: chatbot}"></th:block>
  </div>

  <script>
    
    var RUC_RE     = /^[0-9]{11}$/;
    var RAZON_RE   = /^[\s\S]{3,200}$/; 

    
    function setFieldError(inputId, errMsgId, msg) {
      var input = document.getElementById(inputId);
      var err   = errMsgId ? document.getElementById(errMsgId) : null;
      if (msg) {
        if (input) {
          input.classList.add('input-error');
          input.setAttribute('aria-invalid', 'true');
        }
        if (err) { err.textContent = msg; err.style.display = 'block'; }
      } else {
        if (input) {
          input.classList.remove('input-error');
          input.removeAttribute('aria-invalid');
        }
        if (err) err.style.display = 'none';
      }
    }

    
    function validateRuc() {
      var input = document.getElementById('input-ruc');
      if (!input) return true; 
      var v = (input.value || '').trim();
      if (v === '') {
        setFieldError('input-ruc', null, '');
        return false;
      }
      if (!/^[0-9]+$/.test(v)) {
        setFieldError('input-ruc', null, '');
        return false;
      }
      if (!RUC_RE.test(v)) {
        setFieldError('input-ruc', null, '');
        return false;
      }
      setFieldError('input-ruc', null, '');
      return true;
    }

    
    function validateRazonSocial() {
      var input = document.getElementById('input-razon-social');
      if (!input) return true;
      var v = (input.value || '').trim();
      if (v === '') {
        setFieldError('input-razon-social', 'err-razon-social',
          'La razón social es obligatoria');
        return false;
      }
      if (v.length < 3) {
        setFieldError('input-razon-social', 'err-razon-social',
          'La razón social debe tener al menos 3 caracteres');
        return false;
      }
      if (v.length > 200) {
        setFieldError('input-razon-social', 'err-razon-social',
          'La razón social no puede superar los 200 caracteres');
        return false;
      }
      setFieldError('input-razon-social', 'err-razon-social', '');
      return true;
    }

    
    function evaluarFormulario() {
      var rucOk   = validateRuc();
      var razonOk = validateRazonSocial();
      return rucOk && razonOk;
    }

    
    function verificarRuc() {
      var ruc = document.getElementById('input-ruc').value.trim();
      var fb = document.getElementById('ruc-feedback');
      var btn = document.getElementById('btn-verificar-ruc');
      if (ruc === '' || !RUC_RE.test(ruc)) {
        fb.style.display = 'block'; fb.style.color = '#EF4444';
        fb.textContent = 'Ingresa los 11 dígitos del RUC primero.';
        return;
      }
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Consultando...';
      fb.style.display = 'none';
      fetch('/api/consulta-ruc/' + ruc, { credentials: 'same-origin' })
        .then(function(r) {
          if (r.status === 404) throw new Error('no_encontrado');
          if (!r.ok) throw new Error('error');
          return r.json();
        })
        .then(function(data) {
          var razonInput = document.getElementById('input-razon-social');
          if (razonInput) razonInput.value = data.razonSocial || '';
          validateRazonSocial(); 
          fb.style.display = 'block'; fb.style.color = '#16A34A';
          var extra = data.estadoContribuyente ? ' · ' + data.estadoContribuyente : '';
          fb.textContent = '✓ Razón social completada desde SUNAT.' + extra;
        })
        .catch(function(e) {
          fb.style.display = 'block'; fb.style.color = '#EF4444';
          fb.textContent = e.message === 'no_encontrado'
            ? 'RUC no encontrado en SUNAT.' : 'Error al consultar. Intenta nuevamente.';
        })
        .finally(function() {
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-search"></i> Verificar';
        });
    }

    
    document.addEventListener('DOMContentLoaded', function() {
      var ruc = document.getElementById('input-ruc');
      if (ruc) {
        ruc.addEventListener('input', function() {
          ruc.value = ruc.value.replace(/\D/g, '').slice(0, 11);
          validateRuc();
        });
        ruc.addEventListener('blur', validateRuc);
      }
      var razon = document.getElementById('input-razon-social');
      if (razon) {
        razon.addEventListener('input', validateRazonSocial);
        razon.addEventListener('blur', validateRazonSocial);
      }

      
      var form = document.querySelector('form');
      if (form) {
        form.addEventListener('submit', function(e) {
          if (!evaluarFormulario()) {
            e.preventDefault();
            
            var firstErr = document.querySelector('.input-error');
            if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      }
    });
  </script>

</body>

</html>
