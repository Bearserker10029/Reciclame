<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recíclame — Auditoría del Sistema</title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F5F6FA; }

    .page-header {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .page-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1B3A5C;
      margin-bottom: 8px;
    }

    .page-header p {
      font-size: 14px;
      color: #6B7280;
      margin: 0;
    }

    /* Timeline */
    .audit-timeline {
      position: relative;
      padding: 20px 0;
    }

    .audit-entry {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-left: 4px solid #2ECC71;
      transition: all 0.3s ease;
    }

    .audit-entry:hover {
      box-shadow: 0 8px 16px rgba(0,0,0,0.12);
    }

    .audit-entry.error {
      border-left-color: #DC3545;
      background: #FFF5F7;
    }

    .audit-entry.warning {
      border-left-color: #FFC107;
      background: #FFFAF0;
    }

    .audit-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .audit-action {
      font-size: 16px;
      font-weight: 600;
      color: #1B3A5C;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audit-action i {
      color: #2ECC71;
      font-size: 18px;
    }

    .audit-entry.error .audit-action i {
      color: #DC3545;
    }

    .audit-timestamp {
      font-size: 13px;
      color: #6B7280;
    }

    .audit-details {
      background: #F9FAFB;
      padding: 12px;
      border-radius: 6px;
      margin: 12px 0;
      font-size: 13px;
      line-height: 1.6;
      color: #374151;
    }

    .audit-details strong {
      color: #1B3A5C;
    }

    .audit-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .audit-meta-item {
      background: #F3F4F6;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
    }

    .audit-meta-label {
      color: #6B7280;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .audit-meta-value {
      color: #1B3A5C;
      word-break: break-all;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      background: white;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      font-size: 14px;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #9CA3AF;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-group select {
      padding: 10px 12px;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      font-size: 13px;
    }

    .badge-accion {
      display: inline-block;
      padding: 4px 10px;
      background: #E3F2FD;
      color: #1976D2;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
    }

    .badge-modulo {
      display: inline-block;
      padding: 4px 10px;
      background: #F3E5F5;
      color: #6A1B9A;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
    }

    .badge-estado {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-estado.exitoso {
      background: #D4EDDA;
      color: #155724;
    }

    .badge-estado.fallido {
      background: #F8D7DA;
      color: #721C24;
    }

    .badge-estado.error {
      background: #E7D4F5;
      color: #6A1B9A;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .empty-state-icon {
      font-size: 48px;
      color: #D1D5DB;
      margin-bottom: 12px;
    }

    .empty-state-text {
      font-size: 16px;
      font-weight: 600;
      color: #6B7280;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div style="display:flex;flex-direction:column;min-height:100vh;">
  <th:block th:replace="navbar/topbar :: topbar"></th:block>
  <div style="display:flex;flex:1;min-height:calc(100vh - 64px);">
    <th:block th:replace="navbar/sidebar :: sidebar"></th:block>
    <main style="flex:1;background:#F5F6FA;overflow-y:auto;padding:32px;">

      <!-- Page Header -->
      <div class="page-header">
        <h1><i class="fas fa-shield-alt me-2"></i>Auditoría del Sistema</h1>
        <p>Registro de todas las acciones y cambios realizados en el sistema</p>
      </div>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Buscar por usuario, descripción..." />
        </div>
        <div class="filter-group">
          <select id="filterModulo">
            <option value="">Todos los módulos</option>
            <option value="USUARIOS">Usuarios</option>
            <option value="NORMATIVAS">Normativas</option>
            <option value="ESTUDIOS">Estudios</option>
            <option value="EMPRESAS">Empresas</option>
            <option value="SISTEMA">Sistema</option>
          </select>
          <select id="filterAccion">
            <option value="">Todas las acciones</option>
            <option value="CREAR">Crear</option>
            <option value="EDITAR">Editar</option>
            <option value="ELIMINAR">Eliminar</option>
          </select>
          <select id="filterEstado">
            <option value="">Todos los estados</option>
            <option value="EXITOSO">Exitoso</option>
            <option value="FALLIDO">Fallido</option>
            <option value="ERROR">Error</option>
          </select>
        </div>
      </div>

      <!-- Audit Timeline -->
      <div class="audit-timeline">
        <th:block th:if="${auditorias != null && auditorias.size() > 0}">
          <th:block th:each="auditoria : ${auditorias}">
            <div class="audit-entry" th:classappend="${auditoria.estado}=='EXITOSO'?'':'${auditoria.estado.toLowerCase()}==\"fallido\"?\"error\":\"warning\"'">
              <div class="audit-header">
                <div>
                  <div class="audit-action">
                    <i th:classappend="${auditoria.accion.contains('CREAR')?'fas fa-plus-circle':auditoria.accion.contains('EDITAR')?'fas fa-edit':auditoria.accion.contains('ELIMINAR')?'fas fa-trash-alt':auditoria.accion.contains('BLOQUEAR')?'fas fa-lock':'fas fa-info-circle'}"></i>
                    <span th:text="${auditoria.accion}">Acción</span>
                  </div>
                  <div style="margin-top: 8px; display: flex; gap: 8px;">
                    <span class="badge-modulo" th:text="${auditoria.modulo}">Módulo</span>
                    <span class="badge-estado" th:classappend="${auditoria.estado.toLowerCase()}" th:text="${auditoria.estado}">Estado</span>
                  </div>
                </div>
                <div class="audit-timestamp">
                  <i class="far fa-clock me-1"></i>
                  <span th:text="${#temporals.format(auditoria.fechaAccion, 'dd/MM/yyyy HH:mm:ss')}">Fecha</span>
                </div>
              </div>

              <div class="audit-details">
                <strong>Descripción:</strong> <span th:text="${auditoria.descripcion}">Descripción</span>
                <th:block th:if="${auditoria.mensajeError != null}">
                  <br/><strong>Error:</strong> <span th:text="${auditoria.mensajeError}" style="color: #DC3545;">Mensaje</span>
                </th:block>
              </div>

              <div class="audit-meta">
                <div class="audit-meta-item">
                  <div class="audit-meta-label">Usuario</div>
                  <div class="audit-meta-value" th:text="${auditoria.usuarioNombre}">Usuario</div>
                </div>
                <div class="audit-meta-item">
                  <div class="audit-meta-label">Dirección IP</div>
                  <div class="audit-meta-value" th:text="${auditoria.ipAddress?:'No disponible'}">IP</div>
                </div>
                <div class="audit-meta-item">
                  <div class="audit-meta-label">Navegador</div>
                  <div class="audit-meta-value" th:text="${auditoria.userAgent?:#strings.abbreviate(auditoria.userAgent,30):'No disponible'}">User Agent</div>
                </div>
              </div>

              <th:block th:if="${auditoria.datosAnteriores != null || auditoria.datosNuevos != null}">
                <button class="btn btn-sm btn-outline-primary mt-2" type="button"
                        data-bs-toggle="collapse" th:attr="data-bs-target='#cambios-' + ${auditoria.id}">
                  <i class="fas fa-code-branch me-1"></i>Ver cambios
                </button>
                <div th:id="'cambios-' + ${auditoria.id}" class="collapse mt-2">
                  <div style="background: #1B3A5C; color: #fff; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 12px; overflow-x: auto; max-height: 200px; overflow-y: auto;">
                    <th:block th:if="${auditoria.datosAnteriores != null}">
                      <strong>Antes:</strong><br/>
                      <span th:text="${auditoria.datosAnteriores}">Datos anteriores</span><br/><br/>
                    </th:block>
                    <th:block th:if="${auditoria.datosNuevos != null}">
                      <strong>Después:</strong><br/>
                      <span th:text="${auditoria.datosNuevos}">Datos nuevos</span>
                    </th:block>
                  </div>
                </div>
              </th:block>
            </div>
          </th:block>
        </th:block>

        <th:block th:if="${auditorias == null || auditorias.isEmpty()}">
          <div class="empty-state">
            <div class="empty-state-icon"><i class="fas fa-file-check"></i></div>
            <div class="empty-state-text">No hay registros de auditoría</div>
          </div>
        </th:block>
      </div>

    </main>
  </div>
</div>

<script>
  function getBaseUrl() {
    const path = window.location.pathname;
    return path.startsWith('/superadmin') ? '/superadmin' : '/admin';
  }

  function navTo(page) {
    const base = getBaseUrl();
    window.location.href = `${base}/${page}`;
  }

  // Search and filter functionality
  document.getElementById('searchInput')?.addEventListener('input', filterAuditorias);
  document.getElementById('filterModulo')?.addEventListener('change', filterAuditorias);
  document.getElementById('filterAccion')?.addEventListener('change', filterAuditorias);
  document.getElementById('filterEstado')?.addEventListener('change', filterAuditorias);

  function filterAuditorias() {
    const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase();
    const modulo = (document.getElementById('filterModulo')?.value || '').toLowerCase();
    const accion = (document.getElementById('filterAccion')?.value || '').toLowerCase();
    const estado = (document.getElementById('filterEstado')?.value || '').toLowerCase();

    document.querySelectorAll('.audit-entry').forEach(entry => {
      const text = entry.textContent.toLowerCase();
      const entryModulo = entry.querySelector('.badge-modulo')?.textContent.toLowerCase() || '';
      const entryEstado = entry.querySelector('.badge-estado')?.textContent.toLowerCase() || '';
      let visible = true;

      if (searchTerm && !text.includes(searchTerm)) visible = false;
      if (modulo && !entryModulo.includes(modulo)) visible = false;
      if (estado && !entryEstado.includes(estado)) visible = false;

      entry.style.display = visible ? '' : 'none';
    });
  }
</script>
</body>
</html>
