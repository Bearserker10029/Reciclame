<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recíclame — Panel de Documentos</title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:#F5F6FA;}
  </style>
  <script>if(typeof navTo==='undefined'){function navTo(p){window.location.href='/admin/'+p;}}</script>
</head>
<body>
<div style="display:flex;flex-direction:column;min-height:100vh;">
  <th:block th:replace="navbar/topbar :: topbar"></th:block>
  <div style="display:flex;flex:1;min-height:calc(100vh - 64px);">
    <th:block th:replace="navbar/sidebar :: sidebar"></th:block>
    <main style="flex:1;background:#F5F6FA;overflow-y:auto;padding:32px;">

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
    <div>
      <h1 style="font-size:22px;font-weight:800;color:#1B3A5C;margin-bottom:4px;">Panel de Documentos</h1>
      <p style="color:#6B7280;font-size:13px;">Gestiona estudios y normativas del repositorio</p>
    </div>
    <button style="padding:10px 20px;border-radius:8px;border:none;background:#2ECC71;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px;">
      <i class="fas fa-cloud-upload-alt"></i> Subir documento
    </button>
  </div>

  <!-- Stats -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;">
    <div style="background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);">
      <div style="font-size:28px;font-weight:800;color:#1B3A5C;margin-bottom:4px;" th:text="${#lists.size(estudios)}">0</div>
      <div style="font-size:12px;color:#6B7280;">Estudios cargados</div>
    </div>
    <div style="background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);">
      <div style="font-size:28px;font-weight:800;color:#1B3A5C;margin-bottom:4px;" th:text="${#lists.size(normativas)}">0</div>
      <div style="font-size:12px;color:#6B7280;">Normativas indexadas</div>
    </div>
    <div style="background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);">
      <div style="font-size:28px;font-weight:800;color:#1B3A5C;margin-bottom:4px;" th:text="${totalDescargas}">0</div>
      <div style="font-size:12px;color:#6B7280;">Descargas totales</div>
    </div>
    <div style="background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);">
      <div style="font-size:28px;font-weight:800;color:#1B3A5C;margin-bottom:4px;" th:text="${#lists.size(estudios) + #lists.size(normativas)}">0</div>
      <div style="font-size:12px;color:#6B7280;">Total documentos</div>
    </div>
  </div>

  <!-- Filters -->
  <div style="background:#fff;border-radius:10px;padding:16px 20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
    <div style="position:relative;flex:1;min-width:200px;">
      <i class="fas fa-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9CA3AF;font-size:13px;"></i>
      <input id="search-docs" class="form-control" placeholder="Buscar documentos..." style="padding-left:36px;" oninput="filtrarDocumentos()" />
    </div>
    <select id="filter-seccion" class="form-control" style="width:auto;padding:10px 14px;" onchange="filtrarDocumentos()">
      <option value="">Sección: Todas</option>
      <option value="Estudio">Estudios</option>
      <option value="Normativa">Repositorio Normativo</option>
    </select>
    <select id="filter-categoria" class="form-control" style="width:auto;padding:10px 14px;" onchange="filtrarDocumentos()">
      <option value="">Categoría: Todas</option>
      <option value="EC">EC</option>
      <option value="GR">GR</option>
      <option value="EE">EE</option>
      <option value="REP">REP</option>
    </select>
    <button onclick="limpiarFiltrosDocumentos()" style="padding:10px 16px;border-radius:8px;border:1px solid #E5E7EB;background:#fff;cursor:pointer;font-size:12px;color:#374151;font-family:inherit;">Limpiar filtros</button>
  </div>

  <!-- Table -->
  <div style="background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow-x:auto;">
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th>Nombre</th><th>Descripción</th><th>Año</th><th>Formatos</th><th>Acceso</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Estudios -->
        <tr class="doc-row"
            th:each="e : ${estudios}"
            th:data-nombre="${e.titulo}"
            th:data-seccion="Estudio"
            th:data-categoria="">
          <td style="font-weight:600;color:#1B3A5C;">
            <span class="tag" style="background:rgba(46,204,113,.1);color:#27AE60;margin-right:6px;">Estudio</span>
            <span th:text="${e.titulo}">—</span>
          </td>
          <td style="color:#6B7280;font-size:12px;max-width:240px;" th:text="${e.descripcionBreve}">—</td>
          <td th:text="${e.anio}">—</td>
          <td>
            <div style="display:flex;gap:4px;">
              <span class="pill"
                    th:style="${e.archivoTipoMime != null and #strings.contains(e.archivoTipoMime,'pdf')} ? 'background:rgba(231,76,60,.12);color:#C0392B;font-size:10px;' : 'background:rgba(46,204,113,.12);color:#27AE60;font-size:10px;'"
                    th:text="${e.archivoTipoMime != null ? #strings.toUpperCase(e.archivoTipoMime) : '—'}">—</span>
            </div>
          </td>
          <td><span class="pill" style="background:rgba(149,165,166,.14);color:#717D7E;font-size:10px;"><i class="fas fa-eye" style="font-size:8px;"></i> Solo lectura</span></td>
          <td>
            <div style="display:flex;gap:6px;">
              <button style="padding:5px 10px;border-radius:6px;border:1px solid #E5E7EB;background:#fff;cursor:pointer;font-size:11px;font-family:inherit;"><i class="fas fa-edit" style="color:#3498DB;"></i></button>
              <button style="padding:5px 10px;border-radius:6px;border:1px solid #E5E7EB;background:#fff;cursor:pointer;font-size:11px;color:#E74C3C;font-family:inherit;"><i class="fas fa-trash-alt"></i></button>
            </div>
          </td>
        </tr>
        <!-- Normativas -->
        <tr class="doc-row"
            th:each="n : ${normativas}"
            th:data-nombre="${n.titulo}"
            th:data-seccion="Normativa"
            th:data-categoria="">
          <td style="font-weight:600;color:#1B3A5C;">
            <span class="tag" style="background:rgba(52,152,219,.1);color:#2471A3;margin-right:6px;">Normativa</span>
            <span th:text="${n.titulo}">—</span>
          </td>
          <td style="color:#6B7280;font-size:12px;max-width:240px;" th:text="${n.descripcionBreve}">—</td>
          <td th:text="${n.anio}">—</td>
          <td>
            <div style="display:flex;gap:4px;">
              <span class="pill" style="background:rgba(231,76,60,.12);color:#C0392B;font-size:10px;">PDF</span>
            </div>
          </td>
          <td>
            <span th:if="${n.esPublica}" class="pill" style="background:rgba(46,204,113,.12);color:#27AE60;font-size:10px;"><i class="fas fa-globe" style="font-size:8px;"></i> Público</span>
            <span th:unless="${n.esPublica}" class="pill" style="background:rgba(149,165,166,.14);color:#717D7E;font-size:10px;"><i class="fas fa-lock" style="font-size:8px;"></i> Restringido</span>
          </td>
          <td>
            <div style="display:flex;gap:6px;">
              <button style="padding:5px 10px;border-radius:6px;border:1px solid #E5E7EB;background:#fff;cursor:pointer;font-size:11px;font-family:inherit;"><i class="fas fa-edit" style="color:#3498DB;"></i></button>
              <button style="padding:5px 10px;border-radius:6px;border:1px solid #E5E7EB;background:#fff;cursor:pointer;font-size:11px;color:#E74C3C;font-family:inherit;"><i class="fas fa-trash-alt"></i></button>
            </div>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(estudios) and #lists.isEmpty(normativas)}">
          <td colspan="6" style="text-align:center;padding:30px;color:#9CA3AF;">No hay documentos registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- ── Script para filtrado de documentos ── -->
  <script>
    /**
     * filtrarDocumentos()
     * Lee los valores de los filtros y oculta/muestra las filas de la tabla
     * según coincidan con los criterios de búsqueda.
     */
    function filtrarDocumentos() {
      var texto = document.getElementById('search-docs')?.value.toLowerCase().trim() || '';
      var seccion = document.getElementById('filter-seccion')?.value.toLowerCase().trim() || '';
      var categoria = document.getElementById('filter-categoria')?.value.toLowerCase().trim() || '';

      document.querySelectorAll('.doc-row').forEach(function(row) {
        var nombre = (row.dataset.nombre || '').toLowerCase();
        var rowSeccion = (row.dataset.seccion || '').toLowerCase();
        var rowCategoria = (row.dataset.categoria || '').toLowerCase();

        // Criterios de coincidencia
        var matchTexto = !texto || nombre.includes(texto);
        var matchSeccion = !seccion || rowSeccion === seccion;
        var matchCategoria = !categoria || rowCategoria === categoria;

        // Mostrar/ocultar según coincidan todos los criterios
        if (matchTexto && matchSeccion && matchCategoria) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      });
    }

    /**
     * limpiarFiltrosDocumentos()
     * Restablece todos los filtros y muestra la tabla completa.
     */
    function limpiarFiltrosDocumentos() {
      document.getElementById('search-docs').value = '';
      document.getElementById('filter-seccion').value = '';
      document.getElementById('filter-categoria').value = '';
      filtrarDocumentos();
    }
  </script>

    </main>
  </div>

  <!-- ── Chatbot (fuera del main para position:fixed) ── -->
  <th:block th:replace="components/chatbot :: chatbot"></th:block>
</div>

</body>
</html>
