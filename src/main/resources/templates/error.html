<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Reciclame - Error</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <style>
    body { background:#F0F4F8; font-family:'Segoe UI',sans-serif; }
    .box { max-width:720px; margin:64px auto; background:#fff; border-radius:14px;
           box-shadow:0 8px 32px rgba(0,0,0,.08); padding:32px; border:1px solid #E5E7EB; }
    h1 { color:#1B3A5C; font-size:22px; margin:0 0 8px; }
    .badge { display:inline-block; padding:4px 10px; border-radius:8px; font-size:12px; font-weight:700; }
    .badge-500 { background:#FDE8E8; color:#C0392B; }
    .badge-404 { background:#E0F2FE; color:#1B3A5C; }
    .badge-403 { background:#FEF3C7; color:#92400E; }
    pre { background:#F9FAFB; padding:14px; border-radius:8px; overflow:auto;
          font-size:12px; color:#374151; border:1px solid #E5E7EB; max-height:280px; }
    a.btn { display:inline-block; margin-top:14px; padding:10px 18px; border-radius:10px;
            background:linear-gradient(135deg,#1B3A5C,#2c5282); color:#fff; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="box">
    <span class="badge"
          th:classappend="${status != null and status == 500} ? ' badge-500'
                          : (${status != null and status == 404} ? ' badge-404' : ' badge-403')">
      Error <span th:text="${status != null ? status : '???'}">500</span>
    </span>
    <h1 style="margin-top:14px;" th:text="${error != null ? error : 'Ha ocurrido un error inesperado'}">
      Ha ocurrido un error inesperado
    </h1>
    <p style="color:#6B7280;font-size:14px;" th:text="${message != null ? message : 'Intentalo de nuevo o contacta al administrador.'}">
      Intentalo de nuevo o contacta al administrador.
    </p>

    <details th:if="${trace != null}" style="margin-top:14px;">
      <summary style="cursor:pointer;color:#1B3A5C;font-weight:600;font-size:13px;">Ver traza (debug)</summary>
      <pre th:text="${trace}"></pre>
    </details>

    <a class="btn" href="javascript:history.back()">Volver</a>
  </div>
</body>
</html>
