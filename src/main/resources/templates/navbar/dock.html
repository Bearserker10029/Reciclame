<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<th:block th:fragment="dock">



  <nav id="app-dock" aria-label="Navegación principal móvil">
    <button class="dock-item" id="dock-inicio" type="button" onclick="reciclameDockGo('/superadmin/inicio', this)" aria-label="Inicio">
      <i class="fas fa-home"></i>
      <span>Inicio</span>
    </button>
    <button class="dock-item" id="dock-estudios" type="button" onclick="reciclameDockGo('/superadmin/estudios', this)" aria-label="Estudios">
      <i class="fas fa-file-alt"></i>
      <span>Estudios</span>
    </button>
    <button class="dock-item" id="dock-normativo" type="button" onclick="reciclameDockGo('/superadmin/normativo', this)" aria-label="Normativo">
      <i class="fas fa-balance-scale"></i>
      <span>Normativo</span>
    </button>
    <button class="dock-item" id="dock-usuarios" type="button" onclick="reciclameDockGo('/superadmin/usuarios', this)" aria-label="Usuarios">
      <i class="fas fa-users"></i>
      <span>Usuarios</span>
      <span class="dock-badge" id="dock-usuarios-badge" style="display:none;">0</span>
    </button>

    <button class="dock-item dock-item--more" id="dock-mas" type="button" onclick="reciclameAbrirDrawer()" aria-label="Más opciones">
      <i class="fas fa-ellipsis-h"></i>
      <span>Más</span>
    </button>
  </nav>

  <script>
    (function () {
      
      
      if (typeof window.reciclameAbrirDrawer !== 'function') {
        window.reciclameAbrirDrawer = function () {
          if (window.innerWidth > 767) return;
          var sb = document.querySelector('.sidebar-nav');
          var sc = document.getElementById('sidebar-scrim');
          if (sb) {
            sb.style.setProperty('display', 'flex', 'important');
            sb.style.setProperty('position', 'fixed', 'important');
            sb.style.setProperty('top', '0', 'important');
            sb.style.setProperty('left', '0', 'important');
            sb.style.setProperty('bottom', '0', 'important');
            sb.style.setProperty('height', '100vh', 'important');
            sb.style.setProperty('width', '280px', 'important');
            sb.style.setProperty('max-width', '85vw', 'important');
            sb.style.setProperty('z-index', '9999', 'important');
            sb.style.setProperty('transform', 'translateX(0)', 'important');
            sb.classList.add('open');
          }
          if (sc) sc.classList.add('open');
          document.body.style.overflow = 'hidden';
        };
      }
      if (typeof window.reciclameCerrarDrawer !== 'function') {
        window.reciclameCerrarDrawer = function () {
          if (window.innerWidth > 767) return;
          var sb = document.querySelector('.sidebar-nav');
          var sc = document.getElementById('sidebar-scrim');
          if (sb) {
            sb.classList.remove('open');
            sb.style.removeProperty('display');
            sb.style.removeProperty('position');
            sb.style.removeProperty('top');
            sb.style.removeProperty('left');
            sb.style.removeProperty('bottom');
            sb.style.removeProperty('height');
            sb.style.removeProperty('width');
            sb.style.removeProperty('max-width');
            sb.style.removeProperty('z-index');
            sb.style.removeProperty('transform');
          }
          if (sc) sc.classList.remove('open');
          document.body.style.overflow = '';
        };
      }

      
      document.addEventListener('click', function (e) {
        if (window.innerWidth > 767) return;
        var path = window.location.pathname;
        if (path.indexOf('/superadmin') !== 0) return;
        var item = e.target.closest('.sidebar-nav .nav-item, .sidebar-nav .nav-subitem');
        if (!item) return;
        
        setTimeout(reciclameCerrarDrawer, 50);
      }, true);

      
      document.addEventListener('DOMContentLoaded', function () {
        
        var path = window.location.pathname;
        var dockMap = {
          '/superadmin':                'dock-inicio',
          '/superadmin/inicio':         'dock-inicio',
          '/superadmin/estudios':       'dock-estudios',
          '/superadmin/normativo':      'dock-normativo',
          '/superadmin/usuarios':       'dock-usuarios',
          '/superadmin/notificaciones': 'dock-mas',
          '/superadmin/perfil':         'dock-mas',
          '/superadmin/auditoria':      'dock-mas',
          '/superadmin/backups':        'dock-mas',
          '/superadmin/parametros':     'dock-mas',
          '/superadmin/empresas':       'dock-mas',
          '/superadmin/impersonar':     'dock-mas',
          '/superadmin/trazabilidad':   'dock-mas',
          '/superadmin/reportes':       'dock-mas',
          '/superadmin/diccionarios':   'dock-mas',
          '/superadmin/documentos':     'dock-mas',
          '/superadmin/admin-docs':     'dock-mas',
          '/superadmin/configuracion-vistas': 'dock-mas'
        };
        var activeId = dockMap[path];
        if (!activeId && path.startsWith('/superadmin/estudios'))  activeId = 'dock-estudios';
        if (!activeId && path.startsWith('/superadmin/normativo')) activeId = 'dock-normativo';
        if (!activeId && path.startsWith('/superadmin/usuarios'))  activeId = 'dock-usuarios';
        document.querySelectorAll('.dock-item').forEach(function (el) { el.classList.remove('active'); });
        if (activeId) {
          var el = document.getElementById(activeId);
          if (el) el.classList.add('active');
        }

        
        try {
          var dockUsuariosBadge = document.getElementById('dock-usuarios-badge');
          if (dockUsuariosBadge) {
            var count = 0;
            var sidebarItems = document.querySelectorAll('.sidebar-nav .nav-item');
            sidebarItems.forEach(function (it) {
              if (it.querySelector('.fa-user-clock') || it.textContent.toLowerCase().indexOf('solicitudes') >= 0) {
                var b = it.querySelector('span[style*="E74C3C"], span[style*="background:#E74C3C"]');
                if (b && b.textContent) {
                  var n = parseInt(b.textContent.replace(/\D+/g, ''), 10);
                  if (!isNaN(n)) count += n;
                }
              }
            });
            if (count > 0) {
              dockUsuariosBadge.textContent = count;
              dockUsuariosBadge.style.display = 'flex';
            } else {
              dockUsuariosBadge.style.display = 'none';
            }
          }
        } catch (e) {  }

        

        
        if (document.querySelector('iframe[allowfullscreen]')) {
          document.body.classList.add('iframe-fullscreen');
        }

        
        if (path.indexOf('/superadmin') === 0) {
          var mobileDock = document.getElementById('mobile-dock');
          if (mobileDock) {
            mobileDock.style.setProperty('display', 'none', 'important');
          }
        }
      });

      
      window.reciclameDockGo = function (url, btn) {
        if (typeof navTo === 'function') {
          
          var name = url.replace('/superadmin/', '').split('/')[0];
          var map = { 'admin-docs': 'documentos' };
          try { navTo(map[name] || name); return; } catch (e) {  }
        }
        window.location.href = url;
      };
    })();
  </script>
</th:block>
</html>
