<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>Topbar</title>
</head>

<body>
  <th:block th:fragment="topbar">
    <style>
      @keyframes bell-shake {
        0%,100% { transform: rotate(0deg); }
        10% { transform: rotate(-18deg); }
        20% { transform: rotate(18deg); }
        30% { transform: rotate(-14deg); }
        40% { transform: rotate(14deg); }
        50% { transform: rotate(-8deg); }
        60% { transform: rotate(8deg); }
        70% { transform: rotate(-4deg); }
        80% { transform: rotate(4deg); }
      }
      .bell-anim { animation: bell-shake 1.2s ease infinite; transform-origin: top center; }

      #notif-dropdown {
        display:none;position:absolute;top:52px;right:0;width:340px;
        background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);
        z-index:9999;overflow:hidden;
      }
      #notif-dropdown.open { display:block; }
      .notif-drop-header {
        display:flex;align-items:center;justify-content:space-between;
        padding:14px 16px 10px;border-bottom:1px solid #F3F4F6;
      }
      .notif-drop-title { font-size:14px;font-weight:700;color:#1B3A5C; }
      .notif-drop-ver-todo {
        font-size:11px;font-weight:600;color:#2ECC71;text-decoration:none;cursor:pointer;
      }
      .notif-drop-ver-todo:hover { text-decoration:underline; }
      .notif-drop-list { max-height:360px;overflow-y:auto; }
      .notif-drop-item {
        display:flex;gap:10px;align-items:flex-start;padding:12px 16px;
        border-bottom:1px solid #F9FAFB;cursor:pointer;transition:background .15s;
      }
      .notif-drop-item:hover { background:#F8FAFC; }
      .notif-drop-item.unread { background:#F0F7FF; }
      .notif-drop-item.unread:hover { background:#E8F3FF; }
      .notif-dot { width:8px;height:8px;border-radius:50%;background:#3498DB;flex-shrink:0;margin-top:5px; }
      .notif-dot.read { background:#D1D5DB; }
      .notif-item-title { font-size:12px;font-weight:600;color:#1B3A5C;margin-bottom:2px;line-height:1.3; }
      .notif-item-msg { font-size:11px;color:#6B7280;line-height:1.4; }
      .notif-item-time { font-size:10px;color:#9CA3AF;margin-top:3px; }
      .notif-drop-empty { padding:28px 16px;text-align:center;color:#9CA3AF;font-size:12px; }
      .notif-drop-footer {
        padding:10px 16px;border-top:1px solid #F3F4F6;text-align:center;
      }
      .notif-drop-footer a {
        font-size:12px;font-weight:600;color:#1B3A5C;text-decoration:none;
      }
      .notif-drop-footer a:hover { text-decoration:underline; }

      /* ── Search box ─────────────────────────────────── */
      #topbar-search {
        position:relative; display:flex; align-items:center;
        background:rgba(255,255,255,.10); border-radius:8px;
        padding:0 10px; height:36px; width:340px; max-width:46vw;
        transition:background .15s, box-shadow .15s;
      }
      #topbar-search:focus-within {
        background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.15);
      }
      #topbar-search i.fa-search { color:rgba(255,255,255,.7); font-size:13px; margin-right:8px; }
      #topbar-search:focus-within i.fa-search { color:#1B3A5C; }
      #topbar-search input {
        flex:1; background:transparent; border:none; outline:none;
        color:#fff; font-size:13px; height:100%;
      }
      #topbar-search:focus-within input { color:#1B3A5C; }
      #topbar-search input::placeholder { color:rgba(255,255,255,.65); }
      #topbar-search:focus-within input::placeholder { color:#9CA3AF; }

      #search-dropdown {
        display:none; position:fixed; background:#fff; border-radius:12px;
        box-shadow:0 8px 32px rgba(0,0,0,.18);
        z-index:9999; overflow:hidden; max-height:480px; overflow-y:auto;
        width:480px; max-width:90vw;
      }
      #search-dropdown.open { display:block; }
      .search-section-title {
        font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
        color:#6B7280; padding:10px 14px 6px; background:#F9FAFB;
      }
      .search-item {
        display:flex; gap:10px; align-items:flex-start; padding:10px 14px;
        cursor:pointer; text-decoration:none; color:inherit; border-bottom:1px solid #F3F4F6;
      }
      .search-item:hover { background:#F8FAFC; }
      .search-item:last-child { border-bottom:none; }
      .search-item .ic {
        flex-shrink:0; width:28px; height:28px; border-radius:6px;
        display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px;
      }
      .ic-normativa { background:#1B3A5C; }
      .ic-estudio   { background:#2ECC71; }
      .ic-usuario   { background:#F39C12; }
      .search-item .body { flex:1; min-width:0; }
      .search-item .titulo { font-size:12px; font-weight:600; color:#1B3A5C; margin-bottom:2px;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .search-item .subtitulo { font-size:11px; color:#6B7280;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .search-item .subtitulo mark { background:#FFF3A8; padding:0 2px; border-radius:2px; }
      .search-empty { padding:24px; text-align:center; color:#9CA3AF; font-size:12px; }
      .search-footer {
        padding:10px 14px; border-top:1px solid #F3F4F6;
        background:#F9FAFB; text-align:center;
      }
      .search-footer a { color:#1B3A5C; font-size:12px; font-weight:600; text-decoration:none; }
      .search-footer a:hover { text-decoration:underline; }
      @media (max-width: 768px) {
        #topbar-search { width: 200px; }
        #search-dropdown { width: 90vw; }
      }
    </style>

    <nav id="navbar"
      style="position:sticky;top:0;z-index:50;background:#1B3A5C;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 12px rgba(0,0,0,.18);flex-shrink:0;">
      <div style="display:flex;align-items:center;gap:10px;">
        <img th:src="@{https://reciclame.org/wp-content/uploads/2025/12/logo-blanco-Reciclame.png}"
          src="https://reciclame.org/wp-content/uploads/2025/12/logo-blanco-Reciclame.png"
          style="height:36px;width:auto;" alt="Recíclame" onerror="this.style.display='none'" />
        <div id="logo-fallback" style="display:none;align-items:center;gap:8px;">
          <div
            style="width:28px;height:28px;background:#2ECC71;border-radius:6px;display:flex;align-items:center;justify-content:center;">
            <i class="fas fa-recycle" style="color:#fff;font-size:14px;"></i>
          </div>
          <span style="color:#fff;font-size:16px;font-weight:700;">Recíclame</span>
        </div>
        <span style="color:rgba(255,255,255,.4);font-size:12px;margin-left:4px;">Repositorio Circular</span>
        <span id="role-badge"
          style="background:rgba(243,156,18,.2);color:#F39C12;font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;"
          th:text="${session.usuarioSesion?.rolNombre}">ADMIN</span>
      </div>

      <!-- Search box global -->
      <th:block sec:authorize="isAuthenticated()">
        <form id="topbar-search" th:action="@{/buscar}" method="get" autocomplete="off"
              style="margin-left:24px;">
          <i class="fas fa-search"></i>
          <input id="topbar-search-input" name="q" type="text"
                 th:placeholder="${#strings.contains(session.usuarioSesion?.rolNombre,'ADMIN') or #strings.contains(session.usuarioSesion?.rolNombre,'SUPERADMIN') ? 'Buscar normativas, estudios o usuarios…' : 'Buscar normativas y estudios…'}"
                 placeholder="Buscar…"
                 aria-label="Búsqueda global" />
        </form>
        <div id="search-dropdown" role="listbox" aria-label="Resultados de búsqueda"></div>
      </th:block>

      <div style="flex:1"></div>
      <div style="display:flex;align-items:center;gap:20px;">
        <th:block sec:authorize="isAuthenticated()">
          <div id="notif-btn" style="position:relative;cursor:pointer;display:flex;align-items:center;">
            <i id="bell-icon" class="fas fa-bell" style="color:rgba(255,255,255,.75);font-size:17px;"
               th:classappend="${noLeidasCount != null and noLeidasCount > 0} ? ' bell-anim' : ''"></i>
            <span id="notif-badge" th:if="${noLeidasCount != null and noLeidasCount > 0}" th:text="${noLeidasCount}"
              style="position:absolute;top:-5px;right:-6px;background:#E74C3C;color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;"></span>

            <div id="notif-dropdown">
              <div class="notif-drop-header">
                <span class="notif-drop-title">Notificaciones</span>
                <div style="display:flex;align-items:center;gap:10px;">
                  <span class="notif-drop-ver-todo" onclick="marcarTodasLeidas()">Marcar todo como leído</span>
                  <a th:href="${notifUrl != null ? notifUrl : '#'}" style="color:#9CA3AF;font-size:13px;line-height:1;" title="Ver todas"><i class="fas fa-cog"></i></a>
                </div>
              </div>
              <div class="notif-drop-list" id="notif-drop-list">
                <div class="notif-drop-empty">Cargando...</div>
              </div>
              <div class="notif-drop-footer">
                <a th:href="${notifUrl != null ? notifUrl : '#'}">Ver todas las notificaciones</a>
              </div>
            </div>
          </div>
        </th:block>
        <div
          style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.06);"
          onclick="navTo('perfil')">
          <div id="avatar-circle"
            style="width:32px;height:32px;border-radius:50%;background:#2ECC71;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;"
            th:text="${session.usuarioSesion != null ? #strings.substring(session.usuarioSesion.nombreCompleto, 0, 2).toUpperCase() : 'US'}">
            AG</div>
          <div>
            <div id="user-name" style="color:#fff;font-size:13px;font-weight:600;line-height:1.2;"
              th:text="${session.usuarioSesion?.nombreCompleto}">Admin General</div>
            <div id="user-role" style="color:rgba(255,255,255,.45);font-size:11px;"
              th:text="${session.usuarioSesion?.rolNombre}">Administrador</div>
          </div>
        </div>
      </div>
    </nav>

    <script>
      // Helper global compartido por ambos IIFE (notif + search)
      function escHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
      }

      (function () {
        var btn = document.getElementById('notif-btn');
        var dropdown = document.getElementById('notif-dropdown');
        var list = document.getElementById('notif-drop-list');
        var badge = document.getElementById('notif-badge');
        var bell = document.getElementById('bell-icon');
        if (!btn || !dropdown) return;

        var loaded = false;
        var notifData = [];

        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          var isOpen = dropdown.classList.contains('open');
          if (!isOpen) {
            dropdown.classList.add('open');
            if (!loaded) { cargarNotificaciones(); }
          } else {
            dropdown.classList.remove('open');
          }
        });

        document.addEventListener('click', function (e) {
          if (!btn.contains(e.target)) {
            dropdown.classList.remove('open');
          }
        });

        function cargarNotificaciones() {
          fetch('/api/notificaciones', { credentials: 'same-origin' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
              loaded = true;
              notifData = data;
              renderLista(data);
              actualizarBadge(data);
            })
            .catch(function () {
              list.innerHTML = '<div class="notif-drop-empty">Error al cargar notificaciones.</div>';
            });
        }

        function renderLista(data) {
          var noLeidas = (data || []).filter(function (n) { return !n.leida; });
          if (noLeidas.length === 0) {
            list.innerHTML = '<div class="notif-drop-empty"><i class="fas fa-bell-slash" style="font-size:24px;color:#D1D5DB;display:block;margin-bottom:8px;"></i>No tienes notificaciones sin leer.</div>';
            return;
          }
          var html = '';
          noLeidas.slice(0, 10).forEach(function (n) {
            html += '<div class="notif-drop-item unread" onclick="leerNotif(' + n.id + ',this)">' +
              '<div class="notif-dot"></div>' +
              '<div style="flex:1;min-width:0;">' +
              '<div class="notif-item-title">' + escHtml(n.titulo || '(Sin título)') + '</div>' +
              (n.mensaje ? '<div class="notif-item-msg">' + escHtml(n.mensaje) + '</div>' : '') +
              '<div class="notif-item-time">' + escHtml(n.tiempoRelativo || '') + '</div>' +
              '</div></div>';
          });
          list.innerHTML = html;
        }

        window.leerNotif = function (id, el) {
          fetch('/api/notificaciones/' + id + '/leer', { method: 'POST', credentials: 'same-origin' })
            .then(function () {
              notifData.forEach(function (n) { if (n.id === id) n.leida = true; });
              el.style.transition = 'opacity .25s';
              el.style.opacity = '0';
              setTimeout(function () {
                el.remove();
                actualizarBadge(notifData);
                if (list.querySelectorAll('.notif-drop-item').length === 0) {
                  list.innerHTML = '<div class="notif-drop-empty"><i class="fas fa-bell-slash" style="font-size:24px;color:#D1D5DB;display:block;margin-bottom:8px;"></i>No tienes notificaciones sin leer.</div>';
                }
              }, 250);
            });
        };

        window.marcarTodasLeidas = function () {
          var pendientes = notifData.filter(function (n) { return !n.leida; });
          Promise.all(pendientes.map(function (n) {
            return fetch('/api/notificaciones/' + n.id + '/leer', { method: 'POST', credentials: 'same-origin' });
          })).then(function () {
            notifData.forEach(function (n) { n.leida = true; });
            list.innerHTML = '<div class="notif-drop-empty"><i class="fas fa-bell-slash" style="font-size:24px;color:#D1D5DB;display:block;margin-bottom:8px;"></i>No tienes notificaciones sin leer.</div>';
            actualizarBadge(notifData);
          });
        };

        function actualizarBadge(data) {
          var noLeidas = data.filter(function (n) { return !n.leida; }).length;
          if (badge) {
            if (noLeidas > 0) {
              badge.textContent = noLeidas;
              badge.style.display = 'flex';
              if (bell) bell.classList.add('bell-anim');
            } else {
              badge.style.display = 'none';
              if (bell) bell.classList.remove('bell-anim');
            }
          }
        }
      })();

      // ── Search box global ─────────────────────────────────────
      (function () {
        var form   = document.getElementById('topbar-search');
        var input  = document.getElementById('topbar-search-input');
        var dropdown = document.getElementById('search-dropdown');
        if (!form || !input || !dropdown) return;

        var debounceTimer = null;
        var currentReq = 0;
        var minChars = 2;

        function isOpen() { return dropdown.classList.contains('open'); }
        function open()  { dropdown.classList.add('open'); }
        function close() { dropdown.classList.remove('open'); }

        function highlight(text, q) {
          if (!q || !text) return escHtml(text || '');
          var safe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          return escHtml(text).replace(new RegExp('(' + safe + ')', 'gi'), '<mark>$1</mark>');
        }

        function iconFor(tipo) {
          if (tipo === 'NORMATIVA') return '<div class="ic ic-normativa"><i class="fas fa-gavel"></i></div>';
          if (tipo === 'ESTUDIO')   return '<div class="ic ic-estudio"><i class="fas fa-flask"></i></div>';
          if (tipo === 'USUARIO')   return '<div class="ic ic-usuario"><i class="fas fa-user"></i></div>';
          return '<div class="ic ic-normativa"><i class="fas fa-file"></i></div>';
        }

        function renderResults(data) {
          var resultados = (data && data.resultados) || [];
          var tipos = (data && data.tiposPermitidos) || [];
          if (tipos.length === 0) {
            dropdown.innerHTML = '<div class="search-empty">No tienes permisos para buscar.</div>';
            positionDropdown();
            open();
            return;
          }
          if (resultados.length === 0) {
            dropdown.innerHTML = '<div class="search-empty"><i class="fas fa-search" style="display:block;font-size:20px;color:#D1D5DB;margin-bottom:8px;"></i>Sin resultados para &laquo;' + escHtml(data.query || '') + '&raquo;</div>';
            positionDropdown();
            open();
            return;
          }
          var grouped = {};
          resultados.forEach(function (r) {
            (grouped[r.tipo] = grouped[r.tipo] || []).push(r);
          });
          var order = ['NORMATIVA', 'ESTUDIO', 'USUARIO'].filter(function (t) { return grouped[t]; });
          var html = '';
          order.forEach(function (tipo) {
            html += '<div class="search-section-title">' + escHtml(tipo) + ' (' + grouped[tipo].length + ')</div>';
            grouped[tipo].forEach(function (r) {
              html += '<a class="search-item" href="' + escHtml(r.url || '#') + '">'
                    +   iconFor(r.tipo)
                    +   '<div class="body">'
                    +     '<div class="titulo">' + escHtml(r.titulo || '(sin título)') + '</div>'
                    +     '<div class="subtitulo">' + highlight(r.subtitulo || r.correo || '', data.query) + '</div>'
                    +   '</div>'
                    + '</a>';
            });
          });
          html += '<div class="search-footer"><a href="/buscar?q=' + encodeURIComponent(data.query || '') + '">Ver todos los resultados →</a></div>';
          dropdown.innerHTML = html;
          positionDropdown();
          open();
        }

        function fetchResults(q) {
          currentReq++;
          var myReq = currentReq;
          console.log('[SEARCH] fetch:', q);
          fetch('/api/search?q=' + encodeURIComponent(q), { credentials: 'same-origin' })
            .then(function (r) {
              console.log('[SEARCH] response status:', r.status);
              if (!r.ok) {
                return r.text().then(function (txt) {
                  throw new Error('HTTP ' + r.status + ': ' + (txt.length > 100 ? txt.substring(0, 100) : txt));
                });
              }
              return r.json();
            })
            .then(function (data) {
              if (myReq !== currentReq) return;
              console.log('[SEARCH] data:', data);
              renderResults(data);
            })
            .catch(function (err) {
              if (myReq !== currentReq) return;
              console.error('[SEARCH] error:', err);
              dropdown.innerHTML = '<div class="search-empty"><i class="fas fa-exclamation-circle" style="color:#E74C3C;font-size:16px;display:block;margin-bottom:6px;"></i>Error: ' + escHtml(err.message || 'Error de conexión') + '</div>';
              positionDropdown();
              open();
            });
        }

        // ── Listeners ──────────────────────────────────────────
        function positionDropdown() {
          var rect = input.getBoundingClientRect();
          dropdown.style.top  = (rect.bottom + 8) + 'px';
          dropdown.style.left = rect.left + 'px';
          dropdown.style.width = rect.width + 'px';
        }

        input.addEventListener('input', function () {
          var q = input.value.trim();
          clearTimeout(debounceTimer);
          if (q.length < minChars) { close(); return; }
          debounceTimer = setTimeout(function () { fetchResults(q); }, 220);
        });

        input.addEventListener('focus', function () {
          if (input.value.trim().length >= minChars && dropdown.innerHTML.trim().length > 0) {
            positionDropdown();
            open();
          }
        });

        // Cerrar dropdown al hacer click FUERA del input y FUERA del dropdown
        document.addEventListener('click', function (e) {
          if (form.contains(e.target)) return;       // click dentro del form (input)
          if (dropdown.contains(e.target)) return;    // click dentro del dropdown
          close();
        });

        // Cerrar con Escape
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && isOpen()) close();
        });
      })();
    </script>
  </th:block>
</body>

</html>
