<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recíclame — Estudios</title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#F5F6FA;}
  </style>
</head>
<body>

<div id="s-app" style="display:flex;flex-direction:column;min-height:100vh;">
  <th:block th:replace="~{navbar/topbar :: topbar}"></th:block>
  <div style="display:flex;flex:1;min-height:calc(100vh - 64px);">
    <th:block th:replace="~{navbar/sidebar :: sidebar}"></th:block>
    <main style="flex:1;background:#F5F6FA;overflow-y:auto;padding:32px;">
      <th:block th:replace="~{Socio/estudios-content :: estudios-content}"></th:block>
    </main>
  </div>
</div>
<script>
  if (typeof navTo === 'undefined') {
    function navTo(page) {
      var map = {'admin-docs': 'documentos'};
      var target = map[page] || page;
      window.location.href = '/' + (window.__baseRole || 'socio') + '/' + target;
    }
  }
  window.__baseRole = 'socio';
</script>
</body>
</html>
