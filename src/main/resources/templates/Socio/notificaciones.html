<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recíclame — Notificaciones</title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#F5F6FA;}
  </style>
</head>
<body>
<div id="s-app" style="display:flex;flex-direction:column;min-height:100vh;">

  <th:block th:replace="navbar/topbar :: topbar"></th:block>

  <div style="display:flex;flex:1;min-height:calc(100vh - 64px);">
    <th:block th:replace="navbar/sidebar :: sidebar"></th:block>

    <main style="flex:1;background:#F5F6FA;overflow-y:auto;padding:32px;">
      <th:block th:fragment="notificaciones-content">

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
          <div>
            <h1 style="font-size:22px;font-weight:800;color:#1B3A5C;margin-bottom:4px;">
              Notificaciones
              <span th:if="${noLeidasCount > 0}"
                    style="margin-left:8px;background:#E74C3C;color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;"
                    th:text="${noLeidasCount}">0</span>
            </h1>
            <p style="color:#6B7280;font-size:13px;">Mantente al día con las actualizaciones del repositorio</p>
          </div>
          <a th:href="@{/socio/notificaciones/configuracion}" href="/socio/notificaciones/configuracion"
             style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid #E5E7EB;background:#fff;font-size:13px;color:#374151;text-decoration:none;">
            <i class="fas fa-cog" style="color:#6B7280;"></i>Configurar
          </a>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;">
          <div th:each="n : ${notificaciones}" th:class="${!n.leida} ? 'notif-card unread' : 'notif-card read'">

            <div class="notif-icon" th:switch="${n.tipo}">
              <span th:case="'NUEVO_ESTUDIO'"    style="background:rgba(46,204,113,.12);">
                <i class="fas fa-file-alt" style="color:#2ECC71;font-size:16px;"></i></span>
              <span th:case="'NUEVA_NORMATIVA'"  style="background:rgba(52,152,219,.12);">
                <i class="fas fa-balance-scale" style="color:#3498DB;font-size:16px;"></i></span>
              <span th:case="'DOCUMENTO_VALIDADO'" style="background:rgba(46,204,113,.12);">
                <i class="fas fa-check-circle" style="color:#2ECC71;font-size:16px;"></i></span>
              <span th:case="'MENSAJE_ADMIN'"    style="background:#F3F4F6;">
                <i class="fas fa-user-shield" style="color:#9CA3AF;font-size:16px;"></i></span>
              <span th:case="*"                  style="background:rgba(243,156,18,.12);">
                <i class="fas fa-bell" style="color:#F39C12;font-size:16px;"></i></span>
            </div>

            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;">
                <span style="font-size:13px;font-weight:600;color:#1B3A5C;" th:text="${n.titulo}">Título</span>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;">
                  <span th:if="${!n.leida}" class="notif-badge-unread">No leída</span>
                  <span style="font-size:11px;color:#9CA3AF;white-space:nowrap;" th:text="${n.tiempoRelativo}">—</span>
                </div>
              </div>
              <p style="font-size:12px;color:#6B7280;line-height:1.5;" th:text="${n.mensaje}">Mensaje</p>
              <form th:if="${!n.leida}" method="post"
                    th:action="@{/socio/notificaciones/marcar/{id}(id=${n.id})}" style="display:inline;">
                <button type="submit" class="btn-mark-read">
                  <i class="fas fa-check" style="margin-right:4px;"></i>Marcar como leída
                </button>
              </form>
            </div>

          </div>

          <div th:if="${#lists.isEmpty(notificaciones)}"
               style="text-align:center;padding:48px;background:#fff;border-radius:12px;color:#9CA3AF;">
            <i class="fas fa-bell-slash" style="font-size:32px;margin-bottom:12px;display:block;"></i>
            No tienes notificaciones por el momento.
          </div>
        </div>

      </th:block>
    </main>
  </div>

  <button id="chatbot-bubble" onclick="toggleChatbot()">
    <img th:src="@{/assets/images/mascota.png}" src="/assets/images/mascota.png" alt="La Buena Cajita" />
  </button>
  <div id="chatbot-panel">
    <div class="chat-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <img th:src="@{/assets/images/mascota.png}" src="/assets/images/mascota.png" alt="La Buena Cajita" />
        <div>
          <div class="chat-title">La Buena Cajita</div>
          <div class="chat-status"><span style="display:inline-block;width:6px;height:6px;background:#2ECC71;border-radius:50%;margin-right:4px;"></span>En línea</div>
        </div>
      </div>
      <button class="chat-close-btn" onclick="toggleChatbot()"><i class="fas fa-times"></i></button>
    </div>
    <div class="chat-messages" id="chat-messages">
      <div class="chat-msg bot"><div class="bubble">¡Hola! Soy La Buena Cajita, tu asistente de Recíclame. ¿En qué puedo ayudarte hoy?</div></div>
    </div>
    <div class="chat-input-area">
      <input type="text" class="chat-input" id="chat-input" placeholder="Pregúntame sobre normativas o economía circular..." onkeypress="if(event.key==='Enter')sendChatMessage()" />
      <button class="chat-send-btn" onclick="sendChatMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script>
if (typeof navTo === 'undefined') {
  function navTo(page) {
    var map = {'admin-docs': 'documentos'};
    var target = map[page] || page;
    window.location.href = '/' + (window.__baseRole || 'socio') + '/' + target;
  }
}
function toggleChatbot() {
  var panel = document.getElementById('chatbot-panel');
  var bubble = document.getElementById('chatbot-bubble');
  if (panel.style.display === 'flex') { panel.style.display = 'none'; bubble.style.display = 'flex'; }
  else { panel.style.display = 'flex'; bubble.style.display = 'none'; }
}
function sendChatMessage() {
  var input = document.getElementById('chat-input');
  var msg = input.value.trim();
  if (!msg) return;
  var div = document.getElementById('chat-messages');
  div.innerHTML += '<div class="chat-msg user"><div class="bubble">' + msg + '</div></div>';
  input.value = '';
  div.scrollTop = div.scrollHeight;
  setTimeout(function() {
    div.innerHTML += '<div class="chat-msg bot"><div class="bubble">Gracias por tu mensaje. Estoy en modo demo.</div></div>';
    div.scrollTop = div.scrollHeight;
  }, 800);
}
document.getElementById('chatbot-bubble').style.display = 'flex';
window.__baseRole = 'socio';
</script>
</body>
</html>
