<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recíclame — Notificaciones</title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>if (typeof navTo === 'undefined') { function navTo(p) { var map = { 'admin-docs': 'documentos' }; window.location.href = '/socio/' + (map[p] || p); } }</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #F0F4F8;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes waterWave {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .water-bg {
      position: relative;
      overflow: hidden;
    }

    .water-bg::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        linear-gradient(135deg, rgba(46, 204, 113, 0.15) 0%, transparent 50%),
        linear-gradient(225deg, rgba(52, 152, 219, 0.12) 0%, transparent 50%),
        linear-gradient(315deg, rgba(41, 128, 185, 0.1) 0%, transparent 50%),
        linear-gradient(45deg, rgba(27, 58, 92, 0.08) 0%, transparent 50%);
      background-size: 400% 400%;
      animation: waterWave 12s ease infinite;
      pointer-events: none;
      z-index: 0;
      border-radius: inherit;
    }

    .water-bg>* {
      position: relative;
      z-index: 1;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.28);


      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
    }

    .notif-card {
      background: rgba(255, 255, 255, 0.28);


      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: all .3s ease;
      animation: fadeUp .4s ease both;
    }

    .notif-card:hover {
      background: rgba(255, 255, 255, 0.42);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .12);
    }

    .notif-card.unread {
      background: rgba(255, 255, 255, 0.42);
      border-color: rgba(46, 204, 113, 0.4);
    }

    .notif-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-chip {
      background: rgba(255, 255, 255, .12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 14px;
      padding: 14px 20px;
      text-align: center;
      cursor: default;
      transition: all .3s ease;
      animation: fadeUp .5s ease both;
    }

    .stat-chip:hover {
      background: rgba(255, 255, 255, .22);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
    }

    .estudios-hero {
      background: linear-gradient(135deg, #1B3A5C 0%, #0f2540 60%, #1a5c3a 100%);
      border-radius: 20px;
      padding: 28px 32px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(27, 58, 92, .35);
      animation: fadeUp .4s ease both;
    }

    .estudios-hero::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46, 204, 113, .25) 0%, transparent 70%);
    }

    .estudios-hero::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: 20%;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 152, 219, .2) 0%, transparent 70%);
    }

    .stat-chip .v {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }

    .stat-chip .l {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .65);
      margin-top: 4px;
    }

    .btn-mark-read {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1.5px solid #E5E7EB;
      background: #fff;
      color: #6B7280;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all .2s;
    }

    .btn-mark-read:hover {
      background: #F3F4F6;
      border-color: #D1D5DB;
    }
  </style>
</head>

<body>
  <div id="s-app" style="display:flex;flex-direction:column;min-height:100vh;">
    <th:block th:replace="~{navbar/topbar :: topbar}"></th:block>
    <div style="display:flex;flex:1;min-height:calc(100vh - 64px);">
      <th:block th:replace="~{navbar/sidebar :: sidebar}"></th:block>

      <main class="water-bg"
        style="flex:1;background: url('https://reciclame.org/wp-content/uploads/2025/12/1-Poryecto-reciclaje.jpg') no-repeat center center fixed; background-size: cover;overflow-y:auto;padding:32px;">

        <div class="estudios-hero" style="margin-bottom:24px;">
          <div
            style="position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:20px;">
            <div>
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
                <div
                  style="width:44px;height:44px;border-radius:12px;background:rgba(46,204,113,.2);display:flex;align-items:center;justify-content:center;">
                  <i class="fas fa-bell" style="color:#2ECC71;font-size:18px;"></i>
                </div>
                <div>
                  <h1 style="font-size:22px;font-weight:800;color:#fff;margin:0;">Notificaciones</h1>
                  <p style="font-size:12px;color:rgba(255,255,255,.65);margin:0;">Mantente al día con las
                    actualizaciones del repositorio</p>
                </div>
              </div>
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
              <div class="stat-chip" style="animation-delay:.1s">
                <div class="v" th:text="${noLeidasCount != null ? noLeidasCount : 0}">0</div>
                <div class="l">No leídas</div>
              </div>
              <div class="stat-chip" style="animation-delay:.2s">
                <div class="v" th:text="${notificaciones != null ? notificaciones.size() : 0}">0</div>
                <div class="l">Totales</div>
              </div>
            </div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;">
          <div th:each="n : ${notificaciones}" th:class="${!n.leida} ? 'notif-card unread' : 'notif-card read'">

            <div class="notif-icon" th:switch="${n.tipo}">
              <span th:case="'NUEVO_ESTUDIO'" style="background:rgba(46,204,113,.12);">
                <i class="fas fa-file-alt" style="color:#2ECC71;font-size:16px;"></i></span>
              <span th:case="'NUEVA_NORMATIVA'" style="background:rgba(52,152,219,.12);">
                <i class="fas fa-balance-scale" style="color:#3498DB;font-size:16px;"></i></span>
              <span th:case="'DOCUMENTO_VALIDADO'" style="background:rgba(46,204,113,.12);">
                <i class="fas fa-check-circle" style="color:#2ECC71;font-size:16px;"></i></span>
              <span th:case="'MENSAJE_ADMIN'" style="background:#F3F4F6;">
                <i class="fas fa-user-shield" style="color:#9CA3AF;font-size:16px;"></i></span>
              <span th:case="*" style="background:rgba(243,156,18,.12);">
                <i class="fas fa-bell" style="color:#F39C12;font-size:16px;"></i></span>
            </div>

            <div style="flex:1;min-width:0;">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;">
                <span style="font-size:13px;font-weight:600;color:#1B3A5C;" th:text="${n.titulo}">Titulo</span>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;">
                  <span th:if="${!n.leida}" class="notif-badge-unread"
                    style="background:rgba(46,204,113,.15);color:#27AE60;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;">No
                    leída</span>
                  <span style="font-size:11px;color:#9CA3AF;white-space:nowrap;" th:text="${n.tiempoRelativo}">—</span>
                </div>
              </div>
              <p style="font-size:12px;color:#6B7280;line-height:1.5;" th:text="${n.mensaje}">Mensaje</p>
              <form th:if="${!n.leida}" method="post" th:action="@{/socio/notificaciones/marcar/{id}(id=${n.id})}"
                style="display:inline;">
                <button type="submit" class="btn-mark-read">
                  <i class="fas fa-check" style="margin-right:4px;"></i>Marcar como leída
                </button>
              </form>
            </div>

          </div>

          <div th:if="${#lists.isEmpty(notificaciones)}"
            style="text-align:center;padding:48px;background:rgba(255,255,255,0.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.5);border-radius:12px;color:#9CA3AF;">
            <i class="fas fa-bell-slash" style="font-size:32px;margin-bottom:12px;display:block;"></i>
            No tienes notificaciones por el momento.
          </div>
        </div>

        <th:block th:replace="~{navbar/footer :: footer}"></th:block>
      </main>
    </div>

    <th:block th:replace="~{components/chatbot :: chatbot}"></th:block>
  </div>

</body>

</html>
