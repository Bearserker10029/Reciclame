<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reciclame — Mi Perfil</title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>if (typeof navTo === 'undefined') { function navTo(p) { var map = { 'admin-docs': 'documentos' }; window.location.href = '/visualizador/' + (map[p] || p); } }</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #F0F4F8;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes waterWave {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .water-bg {
      position: relative;
      overflow: hidden;
    }

    .water-bg::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        linear-gradient(135deg, rgba(46, 204, 113, 0.15) 0%, transparent 50%),
        linear-gradient(225deg, rgba(52, 152, 219, 0.12) 0%, transparent 50%),
        linear-gradient(315deg, rgba(41, 128, 185, 0.1) 0%, transparent 50%),
        linear-gradient(45deg, rgba(27, 58, 92, 0.08) 0%, transparent 50%);
      background-size: 400% 400%;
      animation: waterWave 12s ease infinite;
      pointer-events: none;
      z-index: 0;
      border-radius: inherit;
    }

    .water-bg>* {
      position: relative;
      z-index: 1;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .08);
    }

    .anim-1 {
      animation: fadeUp .5s ease both;
    }

    .estudios-hero {
      background: linear-gradient(135deg, #1B3A5C 0%, #0f2540 60%, #1a5c3a 100%);
      border-radius: 20px;
      padding: 28px 32px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(27, 58, 92, .35);
      animation: fadeUp .4s ease both;
    }

    .estudios-hero::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46, 204, 113, .25) 0%, transparent 70%);
    }

    .estudios-hero::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: 20%;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 152, 219, .2) 0%, transparent 70%);
    }
  </style>
</head>

<body>
  <div style="display:flex;flex-direction:column;min-height:100vh;">
    <th:block th:replace="~{navbar/topbar :: topbar}"></th:block>
    <div style="display:flex;flex:1;min-height:calc(100vh - 64px);">
      <th:block th:replace="~{navbar/sidebar :: sidebar}"></th:block>
      <main class="water-bg"
        style="flex:1;background: url('https://reciclame.org/wp-content/uploads/2025/12/1-Poryecto-reciclaje.jpg') no-repeat center center fixed; background-size: cover;overflow-y:auto;padding:32px;">

        <div class="anim-1">
          <th:block th:replace="~{Visualizador/perfil-content :: perfil-content}"></th:block>
        </div>
        <th:block th:replace="~{navbar/footer :: footer}"></th:block>
      </main>
    </div>
    <th:block th:replace="~{components/chatbot :: chatbot}"></th:block>
  </div>
</body>

</html>
