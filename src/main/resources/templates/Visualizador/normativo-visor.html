<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="'Recíclame — ' + ${normativa.titulo}">Recíclame — Visor</title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" th:href="@{/style.css}" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>if (typeof navTo === 'undefined') { function navTo(p) { var map = { 'admin-docs': 'documentos' }; window.location.href = '/visualizador/' + (map[p] || p); } }</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #F0F4F8;
    }

    .visor-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      padding: 12px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
      flex-wrap: wrap;
      gap: 10px;
    }

    .visor-topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .visor-topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 10px;
      border: 1.5px solid #E5E7EB;
      background: #fff;
      color: #374151;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all .2s;
    }

    .btn-back:hover {
      border-color: #1B3A5C;
      color: #1B3A5C;
      background: #F8FAFC;
    }

    .doc-title {
      font-size: 15px;
      font-weight: 700;
      color: #1B3A5C;
      max-width: 500px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-meta {
      font-size: 11px;
      color: #9CA3AF;
      margin-top: 2px;
    }

    .archivo-no-disponible {
      font-size: 12px;
      color: #EF4444;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div style="display:flex;flex-direction:column;min-height:100vh;">
    <th:block th:replace="~{navbar/topbar :: topbar}"></th:block>
    <div style="display:flex;flex:1;min-height:calc(100vh - 64px);">
      <th:block th:replace="~{navbar/sidebar :: sidebar}"></th:block>
      <main
        style="flex:1;background: url('https://reciclame.org/wp-content/uploads/2025/12/1-Poryecto-reciclaje.jpg') no-repeat center center fixed; background-size: cover;display:flex;flex-direction:column;overflow:hidden;">

        <!-- Barra superior del visor -->
        <div class="visor-topbar">
          <div class="visor-topbar-left">
            <a th:href="${urlRetorno != null ? urlRetorno : '/visualizador/normativo'}" class="btn-back">
              <i class="fas fa-arrow-left"></i> Volver
            </a>
            <div>
              <div class="doc-title" th:text="${normativa.titulo}">Título del documento</div>
              <div class="doc-meta">
                <span th:if="${normativa.anio}" th:text="${normativa.anio + ' · '}"></span>
                <span th:if="${normativa.autor}" th:text="${normativa.autor + ' · '}"></span>
                <span th:if="${normativa.tematicaNombre}" th:text="${normativa.tematicaNombre}"></span>
              </div>
            </div>
          </div>
          <div class="visor-topbar-right">
            <span th:unless="${archivoDisponible}" class="archivo-no-disponible">
              <i class="fas fa-exclamation-triangle"></i> Archivo no disponible
            </span>
          </div>
        </div>

        <!-- Error state: archivo no existe en MinIO -->
        <div th:unless="${archivoDisponible}"
             style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#6B7280;background:#F8FAFC;">
          <i class="fas fa-file-slash" style="font-size:56px;color:#D1D5DB;"></i>
          <p style="font-size:16px;font-weight:700;color:#374151;margin:0;">Archivo no disponible</p>
          <p style="font-size:13px;text-align:center;max-width:380px;margin:0;line-height:1.6;">
            El archivo no existe en el almacenamiento MinIO del contenedor.<br>
            Solicita al administrador que suba el archivo nuevamente.
          </p>
          <a th:href="${urlRetorno != null ? urlRetorno : '/visualizador/normativo'}" class="btn-back" style="margin-top:8px;">
            <i class="fas fa-arrow-left"></i> Volver al listado
          </a>
        </div>

        <!-- iframe fullscreen (solo cuando el archivo existe) -->
        <iframe th:if="${archivoDisponible}"
          th:src="@{/api/documentos/visor(url=${normativa.archivoUrl},titulo=${normativa.titulo},mime=${normativa.archivoTipoMime})}"
          style="flex:1;border:none;width:100%;min-height:calc(100vh - 130px);" allowfullscreen>
        </iframe>

      <th:block th:replace="~{navbar/footer :: footer}"></th:block>
      </main>
    </div>
    <th:block th:replace="~{components/chatbot :: chatbot}"></th:block>
  </div>

</body>

</html>
