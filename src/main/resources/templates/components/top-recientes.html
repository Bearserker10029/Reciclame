<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Top y Recientes</title></head>
<body>
<th:block th:fragment="top-recientes(prefijo)">
  <style>
    .tr-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:24px; }
    .tr-section-title {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:14px;
    }
    .tr-section-title span { display:flex; align-items:center; gap:8px;
      font-weight:700; font-size:15px; color:#1B3A5C; }
    .tr-section-title a { font-size:11px; font-weight:600; color:#2ECC71; text-decoration:none; }
    .tr-section-title a:hover { text-decoration:underline; }

    /* Cards grid interno tipo Pinterest */
    .tr-cards { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .tr-card {
      border-radius:12px; overflow:hidden; text-decoration:none; color:inherit;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
      transition:transform .2s, box-shadow .2s;
      display:flex; flex-direction:column;
    }
    .tr-card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.14); }

    .tr-cover {
      height:88px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:6px;
      position:relative; overflow:hidden;
    }
    .tr-cover::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.12) 0%,transparent 60%);
      pointer-events:none;
    }
    .tr-cover::after {
      content:''; position:absolute;
      width:90px; height:90px; border-radius:50%;
      border:1px solid rgba(255,255,255,.12);
      top:-20px; right:-20px; pointer-events:none;
    }
    .tr-cover-icon {
      font-size:22px; color:rgba(255,255,255,.9); z-index:1;
    }
    .tr-cover-badge {
      font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
      background:rgba(255,255,255,.18); color:rgba(255,255,255,.9);
      padding:2px 7px; border-radius:20px; z-index:1;
    }
    .tr-rank {
      position:absolute; top:7px; left:9px;
      font-size:13px; font-weight:800; color:rgba(255,255,255,.85); z-index:2;
    }
    .tr-views {
      position:absolute; bottom:6px; right:8px; z-index:2;
      display:flex; align-items:center; gap:3px;
      font-size:10px; color:rgba(255,255,255,.8); font-weight:600;
    }

    .tr-body { background:#fff; padding:9px 10px; flex:1; }
    .tr-body-title {
      font-size:11.5px; font-weight:700; color:#1B3A5C;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden; line-height:1.35; margin-bottom:4px;
    }
    .tr-body-meta { font-size:10px; color:#9CA3AF; display:flex; align-items:center; gap:5px; }

    /* Card de reciente */
    .tr-rec-card {
      border-radius:12px; overflow:hidden; text-decoration:none; color:inherit;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
      transition:transform .2s, box-shadow .2s;
      display:flex; flex-direction:column;
    }
    .tr-rec-card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.14); }
    .tr-rec-cover {
      height:72px; display:flex; align-items:center; justify-content:center;
      position:relative; overflow:hidden;
    }
    .tr-rec-cover::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.1) 0%,transparent 60%);
    }
    .tr-rec-time {
      position:absolute; bottom:5px; right:8px; z-index:2;
      font-size:9.5px; color:rgba(255,255,255,.8); font-weight:600;
    }
    .tr-rec-body { background:#fff; padding:8px 10px; flex:1; }
    .tr-rec-title {
      font-size:11px; font-weight:700; color:#1B3A5C;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
      overflow:hidden; line-height:1.35; margin-bottom:3px;
    }
    .tr-rec-meta { font-size:10px; color:#9CA3AF; }

    /* Empty state */
    .tr-empty { text-align:center; padding:28px 0; color:#9CA3AF; font-size:12px; }
    .tr-empty i { font-size:28px; color:#E5E7EB; display:block; margin-bottom:8px; }
  </style>

  <div class="tr-grid">

    <!-- ── TOP 5 MÁS VISTAS ─────────────────────────────────── -->
    <div class="glass-card" style="padding:20px;">
      <div class="tr-section-title">
        <span><i class="fas fa-fire" style="color:#E67E22;font-size:14px;"></i> Más consultadas</span>
        <a th:href="@{/{p}/normativo(p=${prefijo})}">Ver todas →</a>
      </div>

      <div th:if="${topNormativas != null and !topNormativas.isEmpty()}" class="tr-cards">
        <th:block th:each="n,i : ${topNormativas}">
          <a class="tr-card"
             th:href="@{/{p}/normativo/{id}/ver(p=${prefijo},id=${n.id})}">

            <!-- Portada con color de temática -->
            <div class="tr-cover"
                 th:style="'background:linear-gradient(135deg,' + (${n.tematicaColor != null ? n.tematicaColor : '#1B3A5C'}) + ' 0%,' + (${n.tematicaColor != null ? n.tematicaColor : '#1B3A5C'}) + 'CC 100%);'">
              <!-- Número de ranking -->
              <span class="tr-rank"
                    th:text="${i.index == 0 ? '🥇' : (i.index == 1 ? '🥈' : (i.index == 2 ? '🥉' : '#' + (i.index+1)))}">1</span>
              <i class="fas fa-gavel tr-cover-icon"></i>
              <span class="tr-cover-badge"
                    th:text="${n.tematicaCodigo != null ? n.tematicaCodigo : 'NORM'}">NORM</span>
              <!-- Contador vistas -->
              <span class="tr-views">
                <i class="fas fa-eye"></i>
                <span th:text="${n.visualizacionesCount != null ? n.visualizacionesCount : 0}">0</span>
              </span>
            </div>

            <!-- Info -->
            <div class="tr-body">
              <div class="tr-body-title" th:text="${n.titulo}">—</div>
              <div class="tr-body-meta">
                <span th:text="${n.anio}">—</span>
                <span>·</span>
                <span th:text="${n.tipoNormativaNombre != null ? n.tipoNormativaNombre : 'Normativa'}">—</span>
              </div>
            </div>
          </a>
        </th:block>
      </div>

      <div th:if="${topNormativas == null or topNormativas.isEmpty()}" class="tr-empty">
        <i class="fas fa-chart-bar"></i>
        Aún no hay visualizaciones registradas
      </div>
    </div>

    <!-- ── VISTOS RECIENTEMENTE ──────────────────────────────── -->
    <div class="glass-card" style="padding:20px;">
      <div class="tr-section-title">
        <span><i class="fas fa-clock" style="color:#3498DB;font-size:14px;"></i> Vistos recientemente</span>
      </div>

      <div th:if="${recientesUsuario != null and !recientesUsuario.isEmpty()}" class="tr-cards">
        <th:block th:each="r : ${recientesUsuario}">
          <a class="tr-rec-card" th:href="${r.urlVer}">

            <!-- Portada según tipo de icono -->
            <div class="tr-rec-cover"
                 th:style="${r.iconVariant == 'pdf'} ? 'background:linear-gradient(135deg,#C0392B 0%,#E74C3C 100%);'
                           : (${r.iconVariant == 'slide'} ? 'background:linear-gradient(135deg,#D35400 0%,#E67E22 100%);'
                           : 'background:linear-gradient(135deg,#1B3A5C 0%,#2C5F8A 100%);')">
              <i th:class="${r.iconVariant == 'pdf'} ? 'fas fa-file-pdf'
                           : (${r.iconVariant == 'slide'} ? 'fas fa-file-powerpoint'
                           : 'fas fa-file-alt')"
                 style="font-size:24px;color:rgba(255,255,255,.9);z-index:1;"></i>
              <span class="tr-rec-time" th:text="${r.tiempoRelativo}">—</span>
            </div>

            <!-- Info -->
            <div class="tr-rec-body">
              <div class="tr-rec-title" th:text="${r.titulo}">—</div>
              <div class="tr-rec-meta"
                   th:text="${r.documentoTipo == 'NORMATIVA' ? 'Normativa' : 'Estudio'}">—</div>
            </div>
          </a>
        </th:block>
      </div>

      <div th:if="${recientesUsuario == null or recientesUsuario.isEmpty()}" class="tr-empty">
        <i class="fas fa-history"></i>
        Aún no has visto ningún documento
      </div>
    </div>

  </div>
</th:block>
</body>
</html>
