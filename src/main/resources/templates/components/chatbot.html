<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
</head>
<body>

<th:block th:fragment="chatbot" th:if="${chatbotHabilitado}">

  <style>
    .chat-msg.bot .bubble.bot-markdown p { margin: 0 0 6px 0; }
    .chat-msg.bot .bubble.bot-markdown p:last-child { margin-bottom: 0; }
    .chat-msg.bot .bubble.bot-markdown ul,
    .chat-msg.bot .bubble.bot-markdown ol { margin: 4px 0 4px 18px; padding: 0; }
    .chat-msg.bot .bubble.bot-markdown li { margin-bottom: 2px; }
    .chat-msg.bot .bubble.bot-markdown strong { font-weight: 700; }
    .chat-msg.bot .bubble.bot-markdown em { font-style: italic; }
    .chat-msg.bot .bubble.bot-markdown code {
      background: rgba(0,0,0,.08); padding: 1px 5px; border-radius: 4px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
    }
    .chat-msg.bot .bubble.bot-markdown pre {
      background: rgba(0,0,0,.12); padding: 8px 10px; border-radius: 6px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      overflow-x: auto; margin: 4px 0;
    }
    .chat-msg.bot .bubble.bot-markdown a {
      color: #27AE60; text-decoration: underline; word-break: break-all;
    }
    .chat-msg.bot .bubble.bot-markdown h1,
    .chat-msg.bot .bubble.bot-markdown h2,
    .chat-msg.bot .bubble.bot-markdown h3 {
      font-size: 13px; margin: 6px 0 4px; font-weight: 700; color: #fff;
    }
    .chat-msg.bot .bubble.bot-markdown blockquote {
      border-left: 3px solid rgba(255,255,255,.3);
      padding-left: 8px; margin: 4px 0; color: rgba(255,255,255,.75);
    }
  </style>


  <button id="chatbot-bubble"
          onclick="toggleChatbot()"
          style="display:none;"
          aria-label="Abrir asistente La Buena Cajita">
    <img th:src="@{/assets/images/mascota.webp}"
         src="/assets/images/mascota.webp"
         alt="La Buena Cajita" />
  </button>


  <div id="chatbot-panel" style="display:none;" role="dialog" aria-label="Asistente La Buena Cajita">

    <div class="chat-header">
      <div style="display:flex;align-items:center;gap:10px;">
        <img th:src="@{/assets/images/mascota.webp}"
             src="/assets/images/mascota.webp"
             alt="La Buena Cajita" />
        <div>
          <div class="chat-title">La Buena Cajita</div>
          <div class="chat-status">
            <span style="display:inline-block;width:6px;height:6px;
                         background:#2ECC71;border-radius:50%;margin-right:4px;"></span>
            En línea
          </div>
        </div>
      </div>
      <button class="chat-close-btn"
              onclick="toggleChatbot()"
              aria-label="Cerrar chat">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="chat-msg bot">
        <div class="bubble">
          ¡Hola! Soy La Buena Cajita, tu asistente de Recíclame.
          ¿En qué puedo ayudarte hoy?
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text"
             class="chat-input"
             id="chat-input"
             placeholder="Pregúntame sobre normativas o economía circular..."
             onkeypress="if(event.key==='Enter') sendChatMessage()" />
      <button class="chat-send-btn"
              onclick="sendChatMessage()"
              aria-label="Enviar mensaje">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>

  </div>

  <script th:inline="javascript">
    
    window.CHATBOT_WEBHOOK_URL =  'http://localhost:5678/webhook/chatbot-reciclame';
    window.CHATBOT_CALLBACK_URL =  '/api/chatbot/registrar';
    window.USUARIO_ROL =  'ANONYMOUS';
    window.USUARIO_ID =  0;
    window.USUARIO_NOMBRE =  'Anonimo';
    
  </script>


  <script>
  (function () {
    'use strict';

    
    
    
    
    function ensureScriptLoaded(src) {
      return new Promise(function (resolve) {
        if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = function () { resolve(); };
        s.onerror = function () { resolve(); };
        document.head.appendChild(s);
      });
    }
    
    window.__chatbotLibsReady = window.__chatbotLibsReady || (function () {
      var pending = [];
      if (typeof DOMPurify === 'undefined') {
        pending.push(ensureScriptLoaded('https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js'));
      }
      if (typeof marked === 'undefined') {
        pending.push(ensureScriptLoaded('https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js'));
      }
      return pending.length ? Promise.all(pending) : Promise.resolve();
    })();

    
    
    function renderBotMarkdown(text) {
      if (!text) return '';
      try {
        if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
          return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        var html = marked.parse(String(text), { breaks: true, gfm: true });
        return DOMPurify.sanitize(html, {
          ALLOWED_TAGS: ['b', 'i', 'em', 'strong', 'a', 'code', 'pre', 'ul', 'ol', 'li',
                         'p', 'br', 'h1', 'h2', 'h3', 'h4', 'blockquote', 'hr', 'br'],
          ALLOWED_ATTR: ['href', 'title', 'target', 'rel'],
          ALLOW_DATA_ATTR: false
        });
      } catch (e) {
        return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
    }
    
    function renderBotMarkdownAsync(text) {
      if (window.__chatbotLibsReady && typeof window.__chatbotLibsReady.then === 'function') {
        return window.__chatbotLibsReady.then(function () { return renderBotMarkdown(text); });
      }
      return Promise.resolve(renderBotMarkdown(text));
    }

    
    
    function enviarCallbackRegistro(datos) {
      try {
        if (!datos || !window.CHATBOT_CALLBACK_URL) return;
        
        var payload = JSON.stringify(datos);
        if (navigator.sendBeacon) {
          var blob = new Blob([payload], { type: 'application/json' });
          if (navigator.sendBeacon(window.CHATBOT_CALLBACK_URL, blob)) return;
        }
        fetch(window.CHATBOT_CALLBACK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: payload,
          credentials: 'same-origin',
          keepalive: true
        }).catch(function () {  });
      } catch (e) {  }
    }

    
    var SS_MSGS  = 'chatbot:msgs:' + (window.USUARIO_ID || '0');
    var SS_OPEN  = 'chatbot:open:' + (window.USUARIO_ID || '0');

    function guardarMensajes() {
      try {
        var msgs = document.getElementById('chat-messages');
        if (msgs) sessionStorage.setItem(SS_MSGS, msgs.innerHTML);
      } catch (e) {  }
    }
    function restaurarMensajes() {
      try {
        var saved = sessionStorage.getItem(SS_MSGS);
        var msgs = document.getElementById('chat-messages');
        if (saved && msgs) {
          msgs.innerHTML = saved;
          msgs.scrollTop = msgs.scrollHeight;
        }
      } catch (e) {  }
    }

    
    function initChatbot() {
      var bubble = document.getElementById('chatbot-bubble');
      var panel  = document.getElementById('chatbot-panel');
      if (!bubble || !panel) return;

      restaurarMensajes();
      var estabaAbierto = sessionStorage.getItem(SS_OPEN) === '1';
      if (estabaAbierto) {
        panel.style.display  = 'flex';
        bubble.style.display = 'none';
        var msgs = document.getElementById('chat-messages');
        if (msgs) msgs.scrollTop = msgs.scrollHeight;
      } else {
        bubble.style.display = 'flex';
      }
    }

    
    if (typeof window.toggleChatbot === 'undefined') {
      window.toggleChatbot = function () {
        var panel  = document.getElementById('chatbot-panel');
        var bubble = document.getElementById('chatbot-bubble');
        if (!panel || !bubble) return;

        var isOpen = panel.style.display === 'flex';
        panel.style.display  = isOpen ? 'none' : 'flex';
        bubble.style.display = isOpen ? 'flex' : 'none';
        try { sessionStorage.setItem(SS_OPEN, isOpen ? '0' : '1'); } catch (e) {}
      };
    }

    
    if (typeof window.sendChatMessage === 'undefined') {
      window.sendChatMessage = function () {
        var input = document.getElementById('chat-input');
        var msgs  = document.getElementById('chat-messages');
        if (!input || !msgs) return;

        var msg = input.value.trim();
        if (!msg) return;

        var userMsgHtml = '<div class="chat-msg user"><div class="bubble">' +
                          msg.replace(/</g, '&lt;').replace(/>/g, '&gt;') +
                          '</div></div>';
        msgs.innerHTML += userMsgHtml;
        input.value = '';
        msgs.scrollTop = msgs.scrollHeight;
        guardarMensajes();

        var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
        var errorFlag = false;
        var errorMsg = null;

        fetch(window.CHATBOT_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: msg,
            userRole: window.USUARIO_ROL,
            userId: window.USUARIO_ID
          })
        })
        .then(function(res) { return res.text(); })
        .then(function(data) {
          var content = data;
          try {
            var json = JSON.parse(data);
            content = (json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content)
                     ? json.choices[0].message.content
                     : (json.response || content);
          } catch (e) {}
          
          renderBotMarkdownAsync(content).then(function (rendered) {
            var botMsgHtml = '<div class="chat-msg bot"><div class="bubble bot-markdown">' + rendered + '</div></div>';
            msgs.innerHTML += botMsgHtml;
            msgs.scrollTop = msgs.scrollHeight;
            guardarMensajes();
          });

          var t1 = (window.performance && performance.now) ? performance.now() : Date.now();
          var duracionMs = Math.max(0, Math.round(t1 - t0));
          enviarCallbackRegistro({
            usuarioId: parseInt(window.USUARIO_ID, 10) || 0,
            usuarioRol: window.USUARIO_ROL,
            usuarioNombre: window.USUARIO_NOMBRE,
            idioma: 'es',
            pregunta: msg,
            respuesta: content,
            duracionMs: duracionMs,
            modelo: 'minimax',
            derivadoSoporte: false,
            esError: false,
            userAgent: navigator.userAgent || ''
          });
        })
        .catch(function(err) {
          errorFlag = true;
          errorMsg = (err && err.message) ? err.message : 'Error desconocido';
          renderBotMarkdownAsync('Lo siento, el asistente no está disponible.').then(function (rendered) {
            var botMsgHtml = '<div class="chat-msg bot"><div class="bubble bot-markdown">' + rendered + '</div></div>';
            msgs.innerHTML += botMsgHtml;
            msgs.scrollTop = msgs.scrollHeight;
            guardarMensajes();
          });
          var t1 = (window.performance && performance.now) ? performance.now() : Date.now();
          var duracionMs = Math.max(0, Math.round(t1 - t0));
          enviarCallbackRegistro({
            usuarioId: parseInt(window.USUARIO_ID, 10) || 0,
            usuarioRol: window.USUARIO_ROL,
            usuarioNombre: window.USUARIO_NOMBRE,
            idioma: 'es',
            pregunta: msg,
            respuesta: 'Lo siento, el asistente no está disponible.',
            duracionMs: duracionMs,
            modelo: 'minimax',
            derivadoSoporte: false,
            esError: errorFlag,
            mensajeError: errorMsg,
            userAgent: navigator.userAgent || ''
          });
        });
      };
    }

    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initChatbot);
    } else {
      initChatbot();
    }

  })();
  </script>

</th:block>

</body>
</html>
