<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>


<th:block th:fragment="viewer(archivoUrl, titulo, mime)">

  <style>
    .doc-viewer-wrap {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: calc(100vh - 130px);
    }
    .doc-viewer-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      z-index: 10;
      gap: 16px;
      transition: opacity .3s;
    }
    .doc-viewer-loading.hidden { opacity: 0; pointer-events: none; }
    .doc-viewer-spinner {
      width: 48px; height: 48px;
      border: 4px solid #e2e8f0;
      border-top-color: #2ECC71;
      border-radius: 50%;
      animation: doc-spin 0.9s linear infinite;
    }
    @keyframes doc-spin { to { transform: rotate(360deg); } }
    .doc-viewer-loading-text {
      font-size: 14px; color: #64748b; text-align: center; max-width: 320px;
    }
    .doc-viewer-loading-text strong { color: #1B3A5C; display: block; margin-bottom: 4px; }
    .doc-viewer-retry-btn {
      display: none;
      margin-top: 8px;
      padding: 8px 20px;
      background: #1B3A5C;
      color: #fff;
      border: none; border-radius: 6px;
      cursor: pointer; font-size: 13px;
    }
    .doc-viewer-retry-btn:hover { background: #163050; }
    .doc-viewer-iframe {
      flex: 1; border: none; width: 100%;
      min-height: calc(100vh - 130px);
    }
  </style>

  <div class="doc-viewer-wrap" id="docViewerWrap">

    <div class="doc-viewer-loading" id="docViewerLoading">
      <div class="doc-viewer-spinner"></div>
      <div class="doc-viewer-loading-text">
        <strong id="docViewerMsg">Preparando visualización...</strong>
        <span id="docViewerSubMsg">Los documentos Office (.docx, .pptx) pueden tardar
          unos segundos en procesarse la primera vez.</span>
      </div>
      <button class="doc-viewer-retry-btn" id="docViewerRetryBtn" onclick="docViewerRetry()">
        Reintentar
      </button>
    </div>

  </div>

  <script th:inline="javascript">
    (function () {
      var wrap      = document.getElementById('docViewerWrap');
      var loadingEl = document.getElementById('docViewerLoading');
      var msgEl     = document.getElementById('docViewerMsg');
      var subMsgEl  = document.getElementById('docViewerSubMsg');
      var retryBtn  = document.getElementById('docViewerRetryBtn');

      
      
      var iframeEl  = null;
      var currentIframeUrl = '';

      
      
      var visorUrl = /*[[@{/api/documentos/visor(url=${archivoUrl},titulo=${titulo},mime=${mime})}]]*/ '';

      var FAST_TIMEOUT   = 30000;   
      var RETRY_TIMEOUT  = 120000;  
      var fastTimer, retryTimer;
      var retryCount = 0;
      var MAX_RETRIES = 3;

      function showError(mensaje, subMensaje) {
        clearTimers();
        
        removeIframe();
        
        
        
        if (wrap) wrap.style.display = 'none';
      }

      function showLoading(mensaje, subMensaje) {
        removeIframe();
        if (loadingEl) {
          loadingEl.classList.remove('hidden');
          loadingEl.style.display = 'flex';
        }
        if (msgEl) msgEl.textContent = mensaje || 'Preparando visualización...';
        if (subMsgEl) subMsgEl.textContent = subMensaje || '';
        if (retryBtn) retryBtn.style.display = 'none';
      }

      function startTimers() {
        clearTimers();
        fastTimer = setTimeout(function () {
          msgEl.textContent = 'Procesando documento...';
          subMsgEl.textContent = 'Los archivos grandes pueden tardar 1-2 minutos la primera vez. Por favor espera.';
        }, FAST_TIMEOUT);

        retryTimer = setTimeout(function () {
          if (retryCount < MAX_RETRIES) {
            msgEl.textContent = 'La carga está tomando más tiempo de lo esperado';
            subMsgEl.textContent = 'Reintentando automáticamente... (' + (retryCount + 1) + '/' + MAX_RETRIES + ')';
            docViewerRetry();
          } else {
            msgEl.textContent = 'No se pudo cargar el documento';
            subMsgEl.textContent = 'El servidor está procesando el archivo. Puedes reintentar manualmente.';
            retryBtn.style.display = 'inline-block';
          }
        }, RETRY_TIMEOUT);
      }

      function clearTimers() {
        if (fastTimer)  clearTimeout(fastTimer);
        if (retryTimer) clearTimeout(retryTimer);
      }

      
      function createIframe(url) {
        removeIframe();
        iframeEl = document.createElement('iframe');
        iframeEl.id = 'docViewerIframe';
        iframeEl.className = 'doc-viewer-iframe';
        iframeEl.setAttribute('allowfullscreen', '');
        iframeEl.addEventListener('load', docViewerOnLoad);
        iframeEl.addEventListener('error', docViewerOnError);
        iframeEl.src = url;
        wrap.appendChild(iframeEl);
        currentIframeUrl = url;
      }

      
      function removeIframe() {
        if (iframeEl && iframeEl.parentNode) {
          iframeEl.parentNode.removeChild(iframeEl);
        }
        iframeEl = null;
        currentIframeUrl = '';
      }

      
      function openVisor() {
        showLoading('Preparando visualización...',
                    'Los documentos Office (.docx, .pptx) pueden tardar unos segundos la primera vez.');
        var bustUrl = visorUrl + '&_r=' + Date.now();
        fetch(bustUrl, { method: 'GET', redirect: 'manual', credentials: 'same-origin' })
          .then(function (resp) {
            
            if (resp.type === 'opaqueredirect' || resp.status === 0) {
              
              
              createIframe(bustUrl);
              startTimers();
              return null;
            }
            if (resp.ok || resp.status === 302) {
              createIframe(bustUrl);
              startTimers();
              return null;
            }
            
            
            return resp.text().then(function (txt) {
              var msg = 'No se pudo abrir el documento.';
              try {
                var body = JSON.parse(txt);
                if (body && body.mensaje) msg = body.mensaje;
              } catch (e) {  }
              if (resp.status === 404) {
                showError('Archivo no disponible', msg);
              } else if (resp.status === 400) {
                showError('URL inválida', msg);
              } else {
                showError('Error al abrir el documento', msg);
              }
            });
          })
          .catch(function () {
            showError('Error de red', 'No se pudo conectar con el servidor. Verifica tu conexión.');
          });
      }

      window.docViewerOnLoad = function () {
        try {
          
          if (!iframeEl) return;
          var doc = iframeEl.contentDocument || iframeEl.contentWindow.document;
          var body = doc && doc.body ? doc.body.innerText : '';
          if (body && (body.includes('error') || body.length < 50)) {
            return; 
          }
        } catch (e) {  }
        clearTimers();
        loadingEl.classList.add('hidden');
        setTimeout(function () { loadingEl.style.display = 'none'; }, 300);
      };

      window.docViewerOnError = function () {
        clearTimers();
        if (retryCount < MAX_RETRIES) {
          docViewerRetry();
        } else {
          showError('Error al cargar el documento',
                    'Puedes intentar recargar la página.');
        }
      };

      window.docViewerRetry = function () {
        retryCount++;
        openVisor();
      };

      
      openVisor();
    })();
  </script>

</th:block>

</body>
</html>
