<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Password validator</title></head>
<body>
<!--
  Fragmento reusable para forms de cambio de contraseña.
  Requiere que existan en la página:
    - input#newPassword
    - input#confirmPassword
    - un botón submit DENTRO del mismo <form>
  Inyecta dinámicamente la barra de fuerza, el label y el mensaje de coincidencia
  debajo de cada input.
-->
<th:block th:fragment="password-validator">
  <style>
    .pv-bar {
      height: 4px; border-radius: 2px; background: #E5E7EB;
      margin-top: 6px; overflow: hidden;
    }
    .pv-fill { height: 100%; border-radius: 2px; width: 0%; transition: width .3s, background .3s; }
    .pv-label { font-size: 11.5px; color: #6B7280; margin-top: 4px; font-weight: 600; }
    .pv-match { font-size: 11.5px; margin-top: 4px; font-weight: 600; min-height: 14px; }
    .pv-match.ok  { color: #2ECC71; }
    .pv-match.bad { color: #E74C3C; }
  </style>

  <script>
  (function () {
    document.addEventListener('DOMContentLoaded', function () {
      var pwd  = document.getElementById('newPassword');
      var conf = document.getElementById('confirmPassword');
      if (!pwd || !conf) return;

      // Crear elementos visuales debajo de cada input
      var bar     = document.createElement('div'); bar.className = 'pv-bar';
      var fill    = document.createElement('div'); fill.className = 'pv-fill';
      bar.appendChild(fill);
      var label   = document.createElement('div'); label.className = 'pv-label';
      label.textContent = 'Escribe tu nueva contraseña';
      pwd.parentNode.appendChild(bar);
      pwd.parentNode.appendChild(label);

      var matchMsg = document.createElement('div'); matchMsg.className = 'pv-match';
      conf.parentNode.appendChild(matchMsg);

      var levels = [
        { max: 0,   color: 'transparent', label: 'Escribe tu nueva contraseña' },
        { max: 25,  color: '#E74C3C',     label: 'Muy débil' },
        { max: 50,  color: '#E67E22',     label: 'Débil' },
        { max: 75,  color: '#F1C40F',     label: 'Aceptable' },
        { max: 100, color: '#2ECC71',     label: 'Fuerte' }
      ];

      function calcStrength(v) {
        var s = 0;
        if (v.length >= 8)  s += 25;
        if (v.length >= 12) s += 25;
        if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s += 25;
        if (/[0-9]/.test(v)) s += 15;
        if (/[^a-zA-Z0-9]/.test(v)) s += 10;
        return Math.min(s, 100);
      }

      function updateStrength() {
        var s = calcStrength(pwd.value);
        fill.style.width = s + '%';
        var lvl = s === 0 ? levels[0] : (levels.find(function (l) { return s <= l.max; }) || levels[4]);
        fill.style.background = lvl.color;
        label.style.color = s === 0 ? '#6B7280' : lvl.color;
        label.textContent = lvl.label;
      }

      function updateMatch() {
        if (!conf.value) { matchMsg.textContent = ''; matchMsg.className = 'pv-match'; return; }
        if (pwd.value === conf.value) {
          matchMsg.className = 'pv-match ok';
          matchMsg.textContent = '✓ Las contraseñas coinciden';
        } else {
          matchMsg.className = 'pv-match bad';
          matchMsg.textContent = '✗ No coinciden';
        }
      }

      pwd.addEventListener('input', function () { updateStrength(); updateMatch(); });
      conf.addEventListener('input', updateMatch);

      // Validación al enviar (bloquea submit si no cumple)
      var form = pwd.closest('form');
      if (form) {
        form.addEventListener('submit', function (e) {
          if (pwd.value.length < 8) {
            e.preventDefault();
            label.style.color = '#E74C3C';
            label.textContent = 'Mínimo 8 caracteres';
            pwd.focus();
            return;
          }
          if (pwd.value !== conf.value) {
            e.preventDefault();
            matchMsg.className = 'pv-match bad';
            matchMsg.textContent = '✗ Las contraseñas no coinciden';
            conf.focus();
            return;
          }
          if (calcStrength(pwd.value) < 40) {
            if (!confirm('Tu contraseña es débil. ¿Continuar de todos modos?')) {
              e.preventDefault();
              pwd.focus();
            }
          }
        });
      }
    });
  })();
  </script>
</th:block>
</body>
</html>
