<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="miUnidadAddSubmenu">
  <style>
    .drive-add-entry { width: 100%; }

    .drive-add-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 13px;
      color: #374151;
      font-family: inherit;
      text-align: left;
    }

    .drive-add-trigger:hover { background: #F3F4F6; }

    #mu-toast-host {
      position: fixed;
      top: 72px;
      right: 16px;
      z-index: 100000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }

    .mu-add-toast {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      line-height: 1.35;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .14);
      border: 1px solid #a7f3d0;
      background: #ecfdf5;
      color: #166534;
      max-width: min(340px, 92vw);
      pointer-events: auto;
      opacity: 0;
      transform: translateX(120%);
      transition: opacity .25s ease, transform .32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mu-add-toast i { flex-shrink: 0; margin-top: 2px; }
    .mu-add-toast.mu-add-toast--in { opacity: 1; transform: translateX(0); }
    .mu-add-toast.mu-add-toast--out {
      opacity: 0;
      transform: translateX(120%);
      transition: opacity .2s ease, transform .25s ease;
    }

    .mu-add-toast.mu-add-toast--err {
      border-color: #fecaca;
      background: #fef2f2;
      color: #b91c1c;
    }

    dialog.mu-add-modal {
      border: none;
      border-radius: 14px;
      padding: 0;
      max-width: 480px;
      width: calc(100vw - 32px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, .22);
    }

    dialog.mu-add-modal:not([open]) { display: none !important; }

    dialog.mu-add-modal[open] {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      max-height: min(88vh, 640px);
    }

    .mu-add-modal::backdrop {
      background: rgba(15, 23, 42, .5);
    }

    .mu-add-modal-panel {
      display: flex;
      flex-direction: column;
      max-height: min(88vh, 640px);
    }

    .mu-add-modal-head {
      padding: 20px 22px 14px;
      border-bottom: 1px solid #eef1f4;
      position: relative;
    }

    .mu-add-modal-head h2 {
      font-size: 17px;
      font-weight: 800;
      color: #1B3A5C;
      margin: 0 36px 6px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mu-add-modal-head h2 i { color: #2ECC71; }

    .mu-add-modal-doc {
      font-size: 12px;
      color: #6B7280;
      margin: 0;
      line-height: 1.45;
      padding-right: 28px;
      word-break: break-word;
    }

    .mu-add-modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: #f3f4f6;
      color: #6B7280;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
    }

    .mu-add-modal-close:hover { background: #e5e7eb; color: #1B3A5C; }

    .mu-add-modal-body {
      padding: 12px 14px;
      overflow-y: auto;
      flex: 1;
      min-height: 120px;
    }

    .mu-add-modal-hint {
      font-size: 11px;
      color: #9CA3AF;
      margin: 0 8px 10px;
    }

    .mu-add-tree-ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .mu-add-tree-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      background: none;
      cursor: pointer;
      font-size: 13px;
      color: #374151;
      font-family: inherit;
      text-align: left;
      transition: background .15s;
    }

    .mu-add-tree-row:hover { background: #F3F4F6; }

    .mu-add-tree-row.mu-add-tree-row--selected {
      background: rgba(46, 204, 113, .12);
      color: #1B3A5C;
      font-weight: 600;
      box-shadow: inset 0 0 0 1px rgba(46, 204, 113, .35);
    }

    .mu-add-tree-row .fa-folder { color: #F5A623; width: 18px; text-align: center; flex-shrink: 0; }
    .mu-add-tree-row .fa-house { color: #2ECC71; width: 18px; text-align: center; flex-shrink: 0; }

    .mu-add-tree-row span {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mu-add-tree-toggle {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #9CA3AF;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .mu-add-tree-toggle:hover { background: rgba(0, 0, 0, .06); color: #1B3A5C; }

    .mu-add-tree-toggle.is-expanded i { transform: rotate(90deg); }

    .mu-add-tree-children {
      list-style: none;
      margin: 0;
      padding: 0 0 0 12px;
    }

    .mu-add-tree-children[hidden] { display: none; }

    .mu-add-modal-empty {
      padding: 24px 12px;
      text-align: center;
      color: #9CA3AF;
      font-size: 13px;
    }

    .mu-add-modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 18px 18px;
      border-top: 1px solid #eef1f4;
    }

    .mu-add-modal-foot button {
      height: 40px;
      padding: 0 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .mu-add-modal-cancel {
      border: 1px solid #E5E7EB;
      background: #fff;
      color: #374151;
    }

    .mu-add-modal-cancel:hover { background: #f9fafb; }

    .mu-add-modal-submit {
      border: 1px solid #2ECC71;
      background: #2ECC71;
      color: #fff;
    }

    .mu-add-modal-submit:hover { background: #27AE60; border-color: #27AE60; }

    .mu-add-modal-submit:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
  </style>

  <dialog id="muAddModal" class="mu-add-modal" aria-labelledby="muAddModalTitle">
    <div class="mu-add-modal-panel">
      <header class="mu-add-modal-head">
        <h2 id="muAddModalTitle"><i class="fas fa-cloud"></i> Mi Unidad</h2>
        <p id="muAddModalDoc" class="mu-add-modal-doc">Selecciona la carpeta destino.</p>
        <button type="button" class="mu-add-modal-close" id="muAddModalClose" aria-label="Cerrar">&times;</button>
      </header>
      <div class="mu-add-modal-body">
        <p class="mu-add-modal-hint">Elige dónde guardar este documento en tu espacio personal.</p>
        <div id="muAddModalTree" class="mu-add-modal-tree" role="tree" aria-label="Carpetas de Mi Unidad"></div>
      </div>
      <footer class="mu-add-modal-foot">
        <button type="button" class="mu-add-modal-cancel" id="muAddModalCancel">Cancelar</button>
        <button type="button" class="mu-add-modal-submit" id="muAddModalSubmit">Añadir aquí</button>
      </footer>
    </div>
  </dialog>

  <script>
    (function () {
      var ARBOL_URL = '/socio/mi-unidad/api/carpetas-arbol';
      var arbolPromise = null;
      var modalState = {
        docTipo: '',
        docId: '',
        docTitulo: '',
        selectedCarpetaId: null
      };

      window.__muInvalidateCarpetasArbol = function () {
        arbolPromise = null;
      };

      function escapeHtml(s) {
        if (s == null) return '';
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      window.showMuAddToast = function (message, isError) {
        var host = document.getElementById('mu-toast-host');
        if (!host) {
          host = document.createElement('div');
          host.id = 'mu-toast-host';
          document.body.appendChild(host);
        }
        var el = document.createElement('div');
        el.className = 'mu-add-toast' + (isError ? ' mu-add-toast--err' : '');
        el.setAttribute('role', 'status');
        el.innerHTML = '<i class="fas ' + (isError ? 'fa-exclamation-circle' : 'fa-check-circle') + '"></i><span>' + escapeHtml(message) + '</span>';
        host.appendChild(el);
        requestAnimationFrame(function () { el.classList.add('mu-add-toast--in'); });
        setTimeout(function () {
          el.classList.remove('mu-add-toast--in');
          el.classList.add('mu-add-toast--out');
          setTimeout(function () { el.remove(); }, 280);
        }, 4200);
      };

      window.submitMuItemAgregar = function (documentoTipo, documentoId, documentoTitulo, carpetaId) {
        var params = new URLSearchParams();
        params.set('documentoTipo', documentoTipo);
        params.set('documentoId', String(documentoId));
        if (carpetaId != null && carpetaId !== '') {
          params.set('carpetaId', String(carpetaId));
        }
        if (documentoTitulo != null && String(documentoTitulo).trim() !== '') {
          params.set('documentoTitulo', String(documentoTitulo).trim());
        }
        return fetch('/socio/mi-unidad/api/item/agregar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
          body: params.toString()
        })
          .then(function (r) {
            return r.text().then(function (t) {
              var j = {};
              if (t) {
                try { j = JSON.parse(t); } catch (e) { j = { ok: false, message: 'Respuesta no válida.' }; }
              }
              return { httpOk: r.ok, j: j };
            });
          })
          .then(function (res) {
            if (res.httpOk && res.j && res.j.ok) {
              if (typeof window.__muInvalidateCarpetasArbol === 'function') {
                window.__muInvalidateCarpetasArbol();
              }
              window.showMuAddToast(res.j.message || 'Se añadió correctamente.', false);
              return true;
            }
            var msg = (res.j && res.j.message) ? res.j.message : 'No se pudo añadir.';
            window.showMuAddToast(msg, true);
            return false;
          })
          .catch(function () {
            window.showMuAddToast('Error de red. Inténtalo de nuevo.', true);
            return false;
          });
      };

      function loadArbol() {
        if (!arbolPromise) {
          arbolPromise = fetch(ARBOL_URL).then(function (r) {
            if (!r.ok) throw new Error('arbol');
            return r.json();
          }).catch(function () {
            arbolPromise = null;
            return null;
          });
        }
        return arbolPromise;
      }

      function getModal() { return document.getElementById('muAddModal'); }

      window.closeMuAddModal = function () {
        var dlg = getModal();
        if (dlg && typeof dlg.close === 'function') dlg.close();
      };

      function setSelectedRow(carpetaId) {
        modalState.selectedCarpetaId = carpetaId;
        var tree = document.getElementById('muAddModalTree');
        if (!tree) return;
        tree.querySelectorAll('.mu-add-tree-row').forEach(function (btn) {
          var id = btn.getAttribute('data-carpeta-id');
          var match = (id === '' && carpetaId == null) || (id !== '' && String(carpetaId) === id);
          btn.classList.toggle('mu-add-tree-row--selected', match);
        });
      }

      function renderNode(node, ul) {
        var hasCh = node.children && node.children.length > 0;
        var li = document.createElement('li');
        li.setAttribute('role', 'treeitem');

        var rowWrap = document.createElement('div');
        rowWrap.style.display = 'flex';
        rowWrap.style.alignItems = 'center';
        rowWrap.style.gap = '2px';

        if (hasCh) {
          var toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'mu-add-tree-toggle';
          toggle.setAttribute('aria-label', 'Expandir');
          toggle.innerHTML = '<i class="fas fa-chevron-right" style="font-size:10px;transition:transform .15s;"></i>';
          var childUl = document.createElement('ul');
          childUl.className = 'mu-add-tree-children';
          childUl.hidden = true;
          toggle.addEventListener('click', function (e) {
            e.stopPropagation();
            var open = childUl.hidden;
            childUl.hidden = !open;
            toggle.classList.toggle('is-expanded', open);
          });
          rowWrap.appendChild(toggle);
          node.children.forEach(function (ch) { renderNode(ch, childUl); });
          var pick = document.createElement('button');
          pick.type = 'button';
          pick.className = 'mu-add-tree-row';
          pick.setAttribute('data-carpeta-id', String(node.id));
          pick.style.flex = '1';
          pick.innerHTML = '<i class="fas fa-folder"></i><span>' + escapeHtml(node.nombre) + '</span>';
          pick.addEventListener('click', function () { setSelectedRow(node.id); });
          pick.addEventListener('dblclick', function () {
            setSelectedRow(node.id);
            confirmMuAddModal();
          });
          rowWrap.appendChild(pick);
          li.appendChild(rowWrap);
          li.appendChild(childUl);
        } else {
          var pickLeaf = document.createElement('button');
          pickLeaf.type = 'button';
          pickLeaf.className = 'mu-add-tree-row';
          pickLeaf.setAttribute('data-carpeta-id', String(node.id));
          pickLeaf.style.width = '100%';
          pickLeaf.style.paddingLeft = '38px';
          pickLeaf.innerHTML = '<i class="fas fa-folder"></i><span>' + escapeHtml(node.nombre) + '</span>';
          pickLeaf.addEventListener('click', function () { setSelectedRow(node.id); });
          pickLeaf.addEventListener('dblclick', function () {
            setSelectedRow(node.id);
            confirmMuAddModal();
          });
          li.appendChild(pickLeaf);
        }
        ul.appendChild(li);
      }

      function renderTree(tree) {
        var container = document.getElementById('muAddModalTree');
        if (!container) return;
        container.innerHTML = '';
        if (!tree) {
          container.innerHTML = '<div class="mu-add-modal-empty">No se pudo cargar tus carpetas.</div>';
          return;
        }
        var ul = document.createElement('ul');
        ul.className = 'mu-add-tree-ul';
        ul.setAttribute('role', 'group');

        var rootLi = document.createElement('li');
        rootLi.setAttribute('role', 'treeitem');
        var rootBtn = document.createElement('button');
        rootBtn.type = 'button';
        rootBtn.className = 'mu-add-tree-row mu-add-tree-row--selected';
        rootBtn.setAttribute('data-carpeta-id', '');
        rootBtn.innerHTML = '<i class="fas fa-house"></i><span>Principal (raíz)</span>';
        rootBtn.addEventListener('click', function () { setSelectedRow(null); });
        rootBtn.addEventListener('dblclick', function () {
          setSelectedRow(null);
          confirmMuAddModal();
        });
        rootLi.appendChild(rootBtn);
        ul.appendChild(rootLi);

        if (tree.children && tree.children.length) {
          tree.children.forEach(function (n) { renderNode(n, ul); });
        } else {
          var empty = document.createElement('li');
          empty.innerHTML = '<div class="mu-add-modal-empty" style="padding:12px;">No tienes subcarpetas. Se guardará en la raíz o crea carpetas en Mi Unidad.</div>';
          ul.appendChild(empty);
        }
        container.appendChild(ul);
        setSelectedRow(null);
      }

      function confirmMuAddModal() {
        var submit = document.getElementById('muAddModalSubmit');
        if (submit) submit.disabled = true;
        window.submitMuItemAgregar(
          modalState.docTipo,
          modalState.docId,
          modalState.docTitulo,
          modalState.selectedCarpetaId
        ).then(function (ok) {
          if (submit) submit.disabled = false;
          if (ok) {
            if (typeof window.closeAllDriveDropdowns === 'function') {
              window.closeAllDriveDropdowns();
            }
            window.closeMuAddModal();
          }
        });
      }

      window.muWireAddEntries = function (root) {
        (root || document).querySelectorAll('.drive-add-entry').forEach(wireEntry);
      };

      window.openMuAddModal = function (entry) {
        if (!entry) return;
        modalState.docTipo = entry.getAttribute('data-mu-tipo') || '';
        modalState.docId = entry.getAttribute('data-mu-id') || '';
        modalState.docTitulo = entry.getAttribute('data-mu-titulo') || '';
        modalState.selectedCarpetaId = null;

        var docEl = document.getElementById('muAddModalDoc');
        if (docEl) {
          var tit = modalState.docTitulo.trim();
          docEl.textContent = tit
            ? 'Documento: «' + tit + '»'
            : 'Selecciona la carpeta donde guardar este documento.';
        }

        var treeEl = document.getElementById('muAddModalTree');
        if (treeEl) {
          treeEl.innerHTML = '<div class="mu-add-modal-empty"><i class="fas fa-spinner fa-spin"></i> Cargando carpetas…</div>';
        }

        if (typeof window.closeAllDriveDropdowns === 'function') {
          window.closeAllDriveDropdowns();
        }

        var dlg = getModal();
        if (dlg && typeof dlg.showModal === 'function') {
          dlg.showModal();
        } else {
          window.showMuAddToast('No se pudo abrir el selector de carpetas.', true);
          return;
        }

        loadArbol().then(renderTree);
      };

      function wireEntry(entry) {
        var trigger = entry.querySelector('.drive-add-trigger');
        if (!trigger || trigger.dataset.muModalWired === '1') return;
        trigger.dataset.muModalWired = '1';
        trigger.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          window.openMuAddModal(entry);
        });
      }

      function patchCloseAll() {
        var prev = window.closeAllDriveDropdowns;
        window.closeAllDriveDropdowns = function () {
          if (typeof prev === 'function') prev();
        };
      }

      function initMuAddModalUi() {
        var dlg = getModal();
        if (!dlg || dlg.dataset.muInit === '1') return;
        dlg.dataset.muInit = '1';
        var closeBtn = document.getElementById('muAddModalClose');
        var cancelBtn = document.getElementById('muAddModalCancel');
        var submitBtn = document.getElementById('muAddModalSubmit');
        if (closeBtn) closeBtn.addEventListener('click', window.closeMuAddModal);
        if (cancelBtn) cancelBtn.addEventListener('click', window.closeMuAddModal);
        if (submitBtn) submitBtn.addEventListener('click', confirmMuAddModal);
        dlg.addEventListener('click', function (e) {
          if (e.target === dlg) window.closeMuAddModal();
        });
        dlg.addEventListener('cancel', function (e) {
          e.preventDefault();
          window.closeMuAddModal();
        });
      }

      function bootMuAdd() {
        initMuAddModalUi();
        patchCloseAll();
        window.muWireAddEntries(document);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootMuAdd);
      } else {
        bootMuAdd();
      }
    })();
  </script>
</th:block>
</body>
</html>
