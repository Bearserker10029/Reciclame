# ── Base de datos (RDS) ────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://rds-endpoint:3306/reciclame_db?useSSL=true&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000
# Pool ajustado: 2 instancias × 12 = 24 conexiones max. RDS db.t3.micro tolera ~60.
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
# Evita conexiones zombie tras reinicio de RDS (lab restart)
spring.datasource.hikari.keepalive-time=180000

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Batch inserts/updates: menos round-trips a RDS
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# In-clause padding: reduce variantes del query cache para WHERE IN (...)
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# ── Thymeleaf cache (CRÍTICO en producción) ───────────────────
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# Cache de templates compilados: ahorra CPU en cada render
spring.thymeleaf.cache=true

# ── Compresión HTTP (reduce bandwidth y mejora TTFB) ──────────
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# ── Virtual Threads (JDK 21+, estables en 26) ─────────────────
# Spring Boot 3.2+ reemplaza el executor de Tomcat por VirtualThreadTaskExecutor
# cuando esta prop está activa. Con virtual threads ya NO aplican
# server.tomcat.threads.max / min-spare (Spring los ignora silenciosamente).
# Beneficio: miles de requests concurrentes sin threads nativos, ideal para
# I/O bloqueante (JPA/Hibernate, kkfileview HTTP, MinIO SDK, exports PDF/PPTX).
# ⚠ Mantener max-connections y accept-count — esos son a nivel conector.
spring.threads.virtual.enabled=true

# ── Tomcat tuning para t3.medium (2 vCPU compartidos por 2 instancias) ────
# Con virtual threads NO se configuran threads.max / min-spare — Spring usa
# un VirtualThreadTaskExecutor. Solo se ajustan los límites del conector:
server.tomcat.accept-count=200
server.tomcat.max-connections=800
# Keep-alive: reusa conexiones, menos handshakes TLS
server.tomcat.keep-alive-timeout=20000
server.tomcat.max-keep-alive-requests=100

# ── Puerto ────────────────────────────────────────────────────
server.port=8080
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=.*\\.(1[6-9]|2[0-9]|3[0-1])\\..*,10\\..*

# ── Mensajes de error (produccion) ────────────────────────────
# `always` para que GlobalRestErrorHandler pueda incluir `mensaje` en respuestas JSON.
server.error.include-message=always
server.error.include-binding-errors=always

# ── Multipart / File Upload ────────────────────────────────────
# 200 MB por archivo / 210 MB por request — alinea con kkfileview (KK_MAX_FILE_SIZE)
# y con client_max_body_size en nginx-proxy-manager.
# ⚠ RECUERDA: nginx-proxy-manager en el EC2 también tiene un límite duro (default 1MB).
# Hay que editar el Proxy Host en http://IP:81 → Advanced → client_max_body_size 210m;
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# ── Logging ────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.org.reciclame=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# ── MinIO / Storage ────────────────────────────────────────────
minio.url=${MINIO_URL:}
minio.internal-url=${MINIO_INTERNAL_URL:}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET:reciclame-docs}

# ── kkfileview ─────────────────────────────────────────────────
kkfileview.url=${KKFILEVIEW_URL:}

# ── Spring Session (JDBC) ───────────────────────────────────────
# Sesiones compartidas para balanceo real (Redis)
spring.session.store-type=redis

# Redis (usar variables de entorno en contenedor)
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# Opcional: si configuras password en Redis
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}

# ── n8n Webhook ────────────────────────────────────────────────────────────
n8n.webhook.url=${N8N_WEBHOOK_URL:}
n8n.chatbot.webhook.url=${N8N_CHATBOT_WEBHOOK_URL:}

# ── Centrifugo (chat en tiempo real) ──────────────────────────────────────
centrifugo.api.url=${CENTRIFUGO_API_URL:http://centrifugo:8000/api}
centrifugo.api.key=${CENTRIFUGO_API_KEY:}
centrifugo.secret=${CENTRIFUGO_SECRET:}
centrifugo.ws.url=${CENTRIFUGO_WS_URL:}

# ── API VirusTotal (escaneo de archivos subidos a normativas/estudios) ─────
# Plan público: 4 req/min, 500 req/día, archivos hasta 650 MB.
# IMPORTANTE: el cache Redis reduce drásticamente el consumo — sólo se le pega
# a VT cuando es la primera vez que se ve ese SHA-256 en 24 h.
virustotal.api.key=${VIRUSTOTAL_API_KEY:}
virustotal.api.url=${VIRUSTOTAL_API_URL:https://www.virustotal.com/api/v3}
virustotal.fail-open=${VIRUSTOTAL_FAIL_OPEN:true}
virustotal.cache.ttl-hours=${VIRUSTOTAL_CACHE_TTL_HOURS:24}
virustotal.poll.max-attempts=${VIRUSTOTAL_POLL_MAX_ATTEMPTS:12}
virustotal.poll.interval-ms=${VIRUSTOTAL_POLL_INTERVAL_MS:5000}
virustotal.timeout-ms=${VIRUSTOTAL_TIMEOUT_MS:30000}

# ── API apiperu.dev (consulta DNI RENIEC / RUC SUNAT) ─────────────────────
apiperudev.dni.url=https://apiperu.dev/api/dni
apiperudev.ruc.url=https://apiperu.dev/api/ruc
apiperudev.token=${APIPERUDEV_TOKEN:}

# ── API Atenea Perú (consulta RUC SUNAT) ──────────────────────────────────
atenea.api.url=http://api.ateneaperu.com/api/Sunat/RucToken
atenea.api.key=${ATENEA_API_KEY:}

# ── App base URL (usado en links de correos) ───────────────────────────────
app.base-url=${APP_BASE_URL:}

# ── URL accesible por kkfileview para el proxy de documentos ───────────────
app.kk-accessible-url=${APP_KK_ACCESSIBLE_URL:http://reciclame-app1:8080}

app.use-local-public-site=${APP_USE_LOCAL_PUBLIC_SITE:true}
app.public-site-url=${APP_PUBLIC_SITE_URL:https://reciclame.org/}

# ── Email (SMTP via variables de entorno; sin credenciales hardcoded) ──────
# Credenciales obligatorias — la app NO arranca si faltan.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Forzar STARTTLS: si el server no negocia TLS, falla el envío (mejor que enviar en plano).
spring.mail.properties.mail.smtp.starttls.required=true
# Timeouts cortos para no colgar threads de Tomcat ante SMTP lento.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# Pool de conexiones SMTP para envíos concurrentes (notificaciones a múltiples usuarios).
spring.mail.properties.mail.smtp.connectionpoolsize=5
spring.mail.properties.mail.smtp.connectionpooltimeout=300
mail.from=${MAIL_FROM:Reciclame <reciclameecodevs@gmail.com>}

# ── Actuator (health checks for ALB) ─────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
