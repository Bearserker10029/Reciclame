# ── Base de datos (RDS) ────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://rds-endpoint:3306/reciclame_db?useSSL=true&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Puerto ────────────────────────────────────────────────────
server.port=8080

# ── Mensajes de error (produccion) ────────────────────────────
server.error.include-message=never
server.error.include-binding-errors=never

# ── Multipart / File Upload ────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# ── Logging ────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.org.reciclame=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# ── MinIO / Storage ────────────────────────────────────────────
minio.url=${MINIO_URL:}
minio.internal-url=${MINIO_INTERNAL_URL:}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET:reciclame-docs}

# ── kkfileview ─────────────────────────────────────────────────
kkfileview.url=${KKFILEVIEW_URL:}

# ── Spring Session (JDBC) ───────────────────────────────────────
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# ── n8n Webhook ────────────────────────────────────────────────────────────
n8n.webhook.url=${N8N_WEBHOOK_URL:}

# ── App base URL (usado en links de correos) ───────────────────────────────
app.base-url=${APP_BASE_URL:}

# ── Actuator (health checks for ALB) ─────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true