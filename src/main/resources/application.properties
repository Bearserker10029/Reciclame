# ── Base de datos ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/reciclame_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ── Puerto ────────────────────────────────────────────────────
server.port=8080
# Confiar en headers X-Forwarded-* de proxies upstream (NPM + nginx_lb).
# Spring reescribirá request.getRemoteAddr() con la IP del primer hop de XFF.
server.forward-headers-strategy=native
# Rango Docker bridge (172.16.0.0/14) y redes privadas 10.0.0.0/8.
# Necesario para que Tomcat acepte XFF cuyo último hop cae en Docker.
server.tomcat.remoteip.internal-proxies=.*\\.(1[6-9]|2[0-9]|3[0-1])\\..*,10\\..*

# ── Virtual Threads (JDK 21+, estables en 26) ─────────────────
# Habilita virtual threads para todos los request handlers de Tomcat.
# Beneficio: miles de conexiones concurrentes sin threads nativos,
# ideal para I/O bloqueante (JPA, kkfileview, MinIO, exports PDF/PPTX).
spring.threads.virtual.enabled=true

# ── Mensajes de error (desarrollo) ────────────────────────────
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# ── Multipart / File Upload ────────────────────────────────────
spring.servlet.multipart.enabled=true
# 200 MB para alinear con kkfileview y permitir subir normativa/estudios pesados.
# El límite duro lo impone nginx-proxy-manager en el front (ver docker-compose / NPM UI).
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# ── Logging ────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.org.reciclame=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# ── MinIO ──────────────────────────────────────────────────────
minio.url=http://localhost:9000
minio.internal-url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=reciclame-docs
# Bucket temporal donde viven los archivos mientras se valida contra VirusTotal.
# Tras validar, se promueve (copy + delete) al bucket definitivo reciclame-docs.
minio.bucket.staging=reciclame-staging

# Purga diferida de archivos en MinIO al reemplazar/eliminar un estudio o normativa.
# El archivo NO se borra inmediato: se programa para dentro de TTL horas, dando
# margen al admin para revertir un reemplazo/eliminación accidental. El
# MinioCleanupScheduler corre cada hora y purga los registros vencidos.
# Override por env: MINIO_PENDING_DELETION_TTL_HOURS, MINIO_PENDING_DELETION_MAX_RETRIES
minio.pending-deletion.ttl-hours=${MINIO_PENDING_DELETION_TTL_HOURS:72}
minio.pending-deletion.max-retries=${MINIO_PENDING_DELETION_MAX_RETRIES:3}
# Cron del scheduler (default: cada hora en el minuto 0). Formato Spring cron (6 campos).
minio.cleanup.cron=${MINIO_CLEANUP_CRON:0 0 * * * *}

# ── Upload staging (flujo async de validación VirusTotal) ──────
# Pool del scanner async; respetar el límite público de VT (4 req/min).
# 2 instancias × max 2 = 4 scans simultáneos posibles en cluster.
upload.scanner.pool.core-size=1
upload.scanner.pool.max-size=2
upload.scanner.pool.queue-capacity=50
# Tamaño máximo a bajar a disco local antes del scan (> esto podría usar streaming).
upload.scanner.max-local-size-bytes=52428800

# ── kkfileview ─────────────────────────────────────────────────
# URL interna usada por el proxy reverso Spring para conectar a kkfileview.
# En Docker: sobreescribir con KKFILEVIEW_URL=http://kkfileview:8012
# Para debug local con `mvn spring-boot:run`: exponer temporalmente puerto 8012 en docker-compose
kkfileview.url=http://localhost:8012

# ── Spring Session (JDBC) ───────────────────────────────────────
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# ── Redis (solo activo en perfil aws) ───────────────────────────
# En dev local no hay Redis, asi que deshabilitamos el health indicator
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.health-enabled=false
management.health.redis.enabled=false

# ── Email (SMTP) ───────────────────────────────────────────────────────────
# ⚠ NO dejes credenciales hardcoded aquí — se empaquetan en el JAR/Docker.
# En perfil `aws` (application-aws.properties) se lee desde variables de entorno.
# Para dev local sin perfil aws, define SPRING_MAIL_USERNAME/SPRING_MAIL_PASSWORD en tu .env
# o en variables de entorno del sistema.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
mail.from=${MAIL_FROM:Reciclame <noreply@reciclame.duckdns.org>}

# ── n8n Webhook ────────────────────────────────────────────────────────────
n8n.webhook.url=http://localhost:5678/webhook/send-email
n8n.chatbot.webhook.url=http://localhost:5678/webhook/chatbot-reciclame
chatbot.enabled=true

# ── Centrifugo (chat en tiempo real) ──────────────────────────────────────
centrifugo.api.url=http://localhost:8001/api
centrifugo.api.key=reciclame-api-key-local-2026
centrifugo.secret=reciclame-jwt-secret-local-2026-needs-at-least-32-bytes-long-ok
centrifugo.ws.url=ws://localhost:8001/connection/websocket

# ── API apiperu.dev (consulta DNI RENIEC / RUC SUNAT) ─────────────────────
apiperudev.dni.url=https://apiperu.dev/api/dni
apiperudev.ruc.url=https://apiperu.dev/api/ruc
apiperudev.token=${APIPERUDEV_TOKEN:}

# ── API Atenea Perú (consulta RUC SUNAT) ──────────────────────────────────
atenea.api.url=http://api.ateneaperu.com/api/Sunat/RucToken
atenea.api.key=${ATENEA_API_KEY:}

# ── App base URL (usado en links de correos) ───────────────────────────────
# En local: localhost. En AWS: sobreescribir con APP_BASE_URL=http://reciclame.ddns.net
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ── URL accesible por kkfileview para el proxy de documentos ───────────────
# En desarrollo local kkfileview (Docker) accede a Spring Boot via host.docker.internal
app.kk-accessible-url=http://host.docker.internal:8080

# ── Actuator (health checks & probes) ─────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true